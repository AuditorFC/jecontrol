<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JE - CONTROL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — navy brand bar, side nav (desktop) / bottom tabs (phone), work area, orange + action button */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EEF1F5; --ink:#0C1A27; --muted:#5A6878; --line:#DFE4EA;
  --brand:#0C1A27; --brand-ink:#FFFFFF; --accent:#EE5A0C; --accent-ink:#FFFFFF; --accent-soft:#FDE9DD;
  --y:#B58600; --y-bg:#FFF3C4; --y-bar:#F2C200;
  --b:#1D56CF; --b-bg:#E2EBFF; --b-bar:#2F6BEA;
  --r:#C2321F; --r-bg:#FCE3DF; --r-bar:#E0442E;
  --g:#1C7C46; --g-bg:#DDF3E6;
  --chart:#0C1A27; --grid:#E6EAEF;
  --shadow:0 1px 2px rgba(12,26,39,.06),0 6px 20px rgba(12,26,39,.08);
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A121A; --surface:#111D28; --surface-2:#172532; --ink:#E7ECF1; --muted:#97A5B4; --line:#233444;
  --brand:#08111A; --accent:#FF6B1F; --accent-soft:#3A2012;
  --y:#F2C94C; --y-bg:#3A300C; --y-bar:#E0B21C; --b:#9DBDFF; --b-bg:#14284D; --b-bar:#5B8DF5;
  --r:#FF9285; --r-bg:#401A15; --r-bar:#E8594A; --g:#7FD6A3; --g-bg:#123222;
  --chart:#9DBDFF; --grid:#1E2E3D; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .flag.ice,:root:not([data-theme="light"]) .deal.frozen,:root:not([data-theme="light"]) .col.ice-col{background:#12324A;color:#9FD3F2;border-color:#2C6A93}}
:root[data-theme="dark"] .flag.ice,:root[data-theme="dark"] .deal.frozen,:root[data-theme="dark"] .col.ice-col{background:#12324A;color:#9FD3F2;border-color:#2C6A93}
:root[data-theme="dark"]{
  --bg:#0A121A; --surface:#111D28; --surface-2:#172532; --ink:#E7ECF1; --muted:#97A5B4; --line:#233444;
  --brand:#08111A; --accent:#FF6B1F; --accent-soft:#3A2012;
  --y:#F2C94C; --y-bg:#3A300C; --y-bar:#E0B21C; --b:#9DBDFF; --b-bg:#14284D; --b-bar:#5B8DF5;
  --r:#FF9285; --r-bg:#401A15; --r-bar:#E8594A; --g:#7FD6A3; --g-bg:#123222;
  --chart:#9DBDFF; --grid:#1E2E3D; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* ---------- Login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px;display:grid;gap:20px}
.login-logo{display:grid;justify-items:center;gap:6px}
.login-logo img{width:180px;border-radius:12px;background:#fff}
.app-name{font-family:var(--f-display);font-weight:800;letter-spacing:.22em;font-size:20px}
.app-name b{color:var(--accent)}
.ms-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600}
.ms-logo{display:grid;grid-template-columns:8px 8px;gap:2px}
.ms-logo i{width:8px;height:8px;display:block}
.company-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px}
.co-logo{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--accent-soft);color:var(--accent);overflow:hidden;flex:none}
.co-logo img{width:100%;height:100%;object-fit:cover}
.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod-tile{display:grid;gap:4px;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.mod-tile:hover{border-color:var(--accent)}
.mod-tile strong{font-family:var(--f-display);font-size:14px}
.mod-tile small{color:var(--muted)}
.mod-tile.locked{opacity:.45;cursor:not-allowed}
.mod-tile .tag{justify-self:start;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}

/* ---------- Shell ---------- */
#app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:220px 1fr}
.topbar{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .mark{width:38px;height:32px;border-radius:7px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.topbar .mark img{width:34px}
.topbar .app-name{font-size:15px;letter-spacing:.18em;white-space:nowrap}
.topbar .spacer{flex:1}
.tb-chip{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:13px;white-space:nowrap;color:#fff}
.tb-chip .co-logo{width:22px;height:22px;border-radius:6px;font-size:10px}
.tb-chip select{background:transparent;border:0;color:#fff;font-weight:600}
.tb-chip select option{color:#0C1A27}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;border-radius:9px;background:transparent;text-align:left;font-weight:600;color:var(--muted)}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn.on{background:var(--accent-soft);color:var(--accent)}
.side .eyebrow{padding:14px 12px 6px}
main{overflow:auto;padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.page{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.page>*{min-width:0}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head h1{font-size:24px}
.tabs-bottom{display:none}

/* ---------- Generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{padding:5px 10px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
/* button groups never push the page wider: they scroll sideways inside themselves on small screens */
.seg{flex-shrink:0;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button,.seg label{white-space:nowrap;flex:none}
.page-head>*{min-width:0;max-width:100%}
@media (max-width:760px){.trow{grid-template-columns:auto 1fr}.trow>.row{grid-column:2;justify-content:flex-start;flex-wrap:wrap}}
.cal-head{flex-wrap:wrap}
/* task rows wrap their date and people under the title when the card is narrow */
.trow>div{min-width:0}
.tt{overflow-wrap:anywhere}
.dash-grid .trow{grid-template-columns:auto 1fr}
.dash-grid .trow>.row{grid-column:2;justify-content:flex-start;flex-wrap:wrap}
/* radio options shown as a segmented control: the text is the button, the checked one is filled */
.seg label,.field .seg label{position:relative;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;margin:0;border:0;border-radius:0;background:transparent;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.seg label+label{border-left:1px solid var(--line)}
.field .seg{justify-self:start}
.seg label input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.stars{color:#E0A800;letter-spacing:1px;margin-left:4px;font-size:.95em}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field input[type=checkbox],.field input[type=radio]{width:auto;padding:0;margin:0;accent-color:var(--accent)}
.field label.row{color:var(--ink);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.y{background:var(--y-bg);color:var(--y)} .pill.b{background:var(--b-bg);color:var(--b)} .pill.r{background:var(--r-bg);color:var(--r)} .pill.g{background:var(--g-bg);color:var(--g)} .pill.n{background:var(--surface-2);color:var(--muted)} .pill.o{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.empty{padding:22px;text-align:center;color:var(--muted)}
.example-note{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
table{border-collapse:collapse;width:100%}
th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll-x{overflow-x:auto}

/* ---------- Calendar ---------- */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.cal-wrap{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);gap:8px}
.cal-head h2{font-size:17px;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
.cal-day{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--surface);text-align:left;border-top:0;border-left:0;min-width:0}
.cal-day:nth-child(7n){border-right:0}
.cal-day.out{background:var(--surface-2)}
.cal-day.out .dnum{opacity:.45}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.dnum{font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
.cal-day.today .dnum b{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px}
.chip{display:block;border-radius:6px;padding:3px 6px 4px 8px;border-left:3px solid;font-size:12px;line-height:1.2;min-width:0;cursor:pointer;text-align:left;width:100%;border-top:0;border-right:0;border-bottom:0}
.chip .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.chip .s{font-variant-numeric:tabular-nums;display:flex;gap:4px;align-items:center;white-space:nowrap;overflow:hidden}
.chip.y{background:var(--y-bg);border-color:var(--y-bar);color:var(--ink)} .chip.y .s{color:var(--y)}
.chip.b{background:var(--b-bg);border-color:var(--b-bar);color:var(--ink)} .chip.b .s{color:var(--b)}
.chip.r{background:var(--r-bg);border-color:var(--r-bar);color:var(--ink)} .chip.r .s{color:var(--r)}
.chip.insp{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(127,140,160,.14) 6px 8px)}
.chip .ins{font-size:9px;font-weight:800;letter-spacing:.06em;padding:0 4px;border-radius:3px;background:var(--b-bar);color:#fff}
.chip .ins.cont{background:var(--accent)}
.more{font-size:11px;color:var(--muted);font-weight:600}
.agenda{display:grid;gap:10px}
.visit{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 0;cursor:pointer;text-align:left;width:100%;overflow:hidden}
.visit .bar{height:100%;min-height:44px;border-radius:0 4px 4px 0}
.visit h3{font-size:15px}
.visit .score{font-family:var(--f-display);font-weight:800;font-size:20px;text-align:right}
.visit .score small{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--muted)}

/* ---------- Audit runner ---------- */
.audit-top{position:sticky;top:0;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.big-score{font-family:var(--f-display);font-weight:800;font-size:30px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--surface-2)}
.sec-h h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.q{display:grid;grid-template-columns:1fr auto;gap:8px 14px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.q .w{font-size:11px;color:var(--muted);font-weight:600}
.ans{display:flex;gap:6px}
.ans button{min-width:52px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.ans button.yes.on{background:var(--g-bg);color:var(--g);border-color:var(--g)}
.ans button.no.on{background:var(--r-bg);color:var(--r);border-color:var(--r)}
.ans button.na.on{background:var(--surface-2);color:var(--ink);border-color:var(--muted)}
.q-extra{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--r-bg);border-radius:9px;padding:8px 10px;font-size:13px}
.q-extra input:not([type=checkbox]){flex:1;min-width:160px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.ph-btn{display:inline-flex;align-items:center;gap:3px;padding:6px 9px;border-radius:8px;border:1px dashed var(--line);background:var(--surface);cursor:pointer;font-size:15px;line-height:1}
.ph-btn b{font-size:11px;color:var(--accent)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.th{position:relative}
.th-x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:10px;display:grid;place-items:center}
.shift{min-width:40px;padding:5px 8px;border-radius:7px;border:1px solid var(--line);font-weight:800;font-size:12px;background:var(--surface)}
.shift.T1{background:var(--b-bg);color:var(--b);border-color:transparent}
.shift.T2{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.shift.D{background:var(--surface-2);color:var(--muted);display:inline-block}
.malla td{padding:6px 4px}
.count-t input{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-variant-numeric:tabular-nums}
.crit{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--r);border:1px solid var(--r);border-radius:4px;padding:0 4px;margin-left:6px}

/* ---------- Dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:2px;min-width:0;container-type:inline-size}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:clamp(15px,13cqi,26px);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.kpi .eyebrow,.kpi .d{overflow-wrap:anywhere}
.kpi .d{font-size:12px;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c7{grid-column:span 7}.c5{grid-column:span 5}.c6{grid-column:span 6}.c12{grid-column:span 12}.c4{grid-column:span 4}.c8{grid-column:span 8}
.card h2{font-size:15px;margin-bottom:12px}
.hbar{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.hbar .track{height:12px;background:var(--surface-2);border-radius:0 4px 4px 0;overflow:hidden}
.hbar .fill{height:100%;background:var(--chart);border-radius:0 4px 4px 0}
.hbar .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.chart-svg text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart-svg .lbl{fill:var(--ink);font-weight:700}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:7px;white-space:nowrap}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.agenda .task,.sheet .task{grid-template-columns:auto 1fr}
.agenda .task>.row,.sheet .task>.row{grid-column:2;justify-content:flex-start}
.task input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.tt{font-weight:600}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);flex:none}

/* ---------- Template editor ---------- */
.tpl-sec{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tpl-sec-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;background:var(--surface-2)}
.tpl-sec-h input.name{flex:1;min-width:160px;font-weight:700;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.pct{display:flex;align-items:center;gap:4px}
.pct input{width:64px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;text-align:right;background:var(--surface)}
.tpl-q{display:grid;grid-template-columns:1fr 130px auto auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.tpl-q input[type=text],.tpl-q select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0;width:100%}
.icon-btn{border:0;background:transparent;color:var(--muted);padding:6px;border-radius:7px}
.icon-btn:hover{background:var(--surface-2);color:var(--r)}
.lock{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--y-bg);color:var(--ink);font-size:14px}

/* ---------- CRM ---------- */
.funnel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.fstep{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.fstep .v{font-family:var(--f-display);font-weight:800;font-size:20px;overflow-wrap:anywhere}
.fbar{height:6px;border-radius:0 3px 3px 0;background:var(--accent)}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-height:200px}
.col-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;font-weight:700;font-size:13px;padding:2px 4px}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;text-align:left;width:100%;cursor:grab;user-select:none;-webkit-user-select:none}
.deal.dragging{opacity:.35}
.drag-ghost{position:fixed;z-index:95;pointer-events:none;box-shadow:var(--shadow);transform:rotate(2deg);cursor:grabbing}
.cal-day.over,.slot.over{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.chip[data-drag]{cursor:grab;touch-action:none}
.hr{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted);font-size:.92em}
.tchip{display:block;font-size:11px;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-grid.week .cal-day.wk{min-height:300px}
.today-h{color:var(--accent)}
.dayview{display:grid}
.slot{display:grid;grid-template-columns:64px 1fr;gap:8px;border-bottom:1px solid var(--line);min-height:40px;padding:4px 10px}
.slot .hh{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px}
.slot-c{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start}
.slot-c .chip{width:auto;min-width:160px}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:7px;padding:3px 7px;justify-self:start}
.flag.warn{background:var(--r-bg);color:var(--r)}
.flag.ice{background:#DCEFFB;color:#1F6F99}
.deal.late{background:var(--r-bg);border-color:var(--r-bar)}
.deal.frozen{background:#E6F4FC;border-color:#8CC8EA}
.col.ice-col{background:#EDF7FD}
.rate{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;font-weight:800;font-size:12px;flex:none}
.rate.rAAA{background:var(--accent-soft);color:var(--accent);min-width:34px}.rate.rA{background:var(--g-bg);color:var(--g)}.rate.rB{background:var(--b-bg);color:var(--b)}.rate.rC{background:var(--y-bg);color:var(--y)}.rate.r-none{background:var(--surface-2);color:var(--muted)}
.avs{display:inline-flex}.avs .av+.av{margin-left:-6px}
.act-tasks{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.assign-box{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 12px;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.assign-box label,.field .assign-box label{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;color:var(--ink);font-weight:500;font-size:14px;cursor:pointer}
.assign-box input{flex:none;width:16px;height:16px}
select.shift{appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center;cursor:pointer}
.shift.P{background:var(--y-bg);color:var(--y);border-color:transparent}
.shift.pend{outline:2px dashed var(--y-bar);outline-offset:1px}
.bell{position:relative;cursor:pointer}.bell svg{width:16px;height:16px}
.bell b{background:var(--accent);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;margin-left:2px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.col.rej-col{background:var(--r-bg)}
.col.today-col{outline:2px solid var(--accent);outline-offset:-2px}
.kanban.week-plan{grid-auto-columns:minmax(140px,1fr)}
.nb{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--r);color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center;font-style:normal}
.tabs-bottom .nb{margin-left:4px;height:16px;min-width:16px;font-size:10px;padding:0 4px}
.lg-btn{border:0;background:transparent;display:inline-flex;align-items:center;gap:6px;font:inherit;color:inherit;cursor:pointer;padding:2px 6px;border-radius:6px}
.lg-btn:hover{background:var(--surface-2)}
.tchip[data-act]{cursor:pointer}
.ph-btn.wide{width:auto;padding:0 10px;gap:6px;font-size:13px;font-weight:600}
.deal:hover{border-color:var(--accent)}
.deal strong{font-size:14px}
.deal .val{font-variant-numeric:tabular-nums;font-weight:700}
.tl{display:grid;gap:10px}
.tl-i{display:grid;grid-template-columns:30px 1fr;gap:10px}
.tl-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800}

/* ---------- FAB + sheets ---------- */
.fab{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:50;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(238,90,12,.45);display:grid;place-items:center;transition:transform .2s}
.fab svg{width:28px;height:28px;transition:transform .2s}
.fab.open{z-index:77}
.fab.open svg{transform:rotate(45deg)}
.fab-menu{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(94px + env(safe-area-inset-bottom,0px));z-index:76;display:grid;gap:8px;justify-items:end}
.fab-item{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-weight:600;white-space:nowrap}
.fab-item i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-style:normal;font-weight:800}
.scrim{position:fixed;inset:0;background:rgba(6,12,18,.45);z-index:70;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:calc(100% - 20px);overflow:auto;padding:20px;display:grid;gap:14px;box-shadow:var(--shadow)}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet-h h2{font-size:19px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:95;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.sync{display:flex;flex-wrap:wrap;gap:8px}
.sync span{font-size:12px;display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}

@media (max-width:980px){
  .cal-wrap{grid-template-columns:1fr}
  .c7,.c5,.c6,.c4,.c8{grid-column:span 12}
  .funnel{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .side{display:none}
  .tabs-bottom{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(64px,1fr);overflow-x:auto;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);position:sticky;bottom:0;z-index:40}
  .tabs-bottom button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:8px 2px;font-size:11px;font-weight:600;color:var(--muted)}
  .tabs-bottom button svg{width:20px;height:20px}
  .tabs-bottom button.on{color:var(--accent)}
  main{padding-bottom:96px}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .fab-menu{bottom:calc(146px + env(safe-area-inset-bottom,0px))}
  .topbar .app-name{display:none}
  .tb-chip.co{display:none}
  .topbar{gap:8px}
  .tb-chip{padding:4px 8px;font-size:12px}
  .tb-chip .lab{display:none}
  .topbar>*,.tb-chip{min-width:0}
  .tb-chip select{max-width:28vw;text-overflow:ellipsis}
  .tb-chip.bell{padding:4px 7px}
  #app>*{min-width:0}
  .cal-day{min-height:58px;padding:4px}
  .chip{padding:0;border-left:0;height:6px;border-radius:3px}
  .chip .t,.chip .s{display:none}
  .chip.y{background:var(--y-bar)}.chip.b{background:var(--b-bar)}.chip.r{background:var(--r-bar)}
  .more{display:none}
  .grid2{grid-template-columns:1fr}
  .hbar{grid-template-columns:110px 1fr 48px}
  .tpl-q{grid-template-columns:1fr 1fr}
  .tpl-q input[type=text]{grid-column:1/-1}
  .mod-grid{grid-template-columns:1fr}
  .funnel{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};

function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function addMonths(s,n){const d=parse(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return iso(d)}
function nextDue(t,from){
  const r=t.repeat;let n=from;
  if(r==="daily")return addDays(n,1);
  if(r==="weekdays"){do n=addDays(n,1);while([0,6].includes(parse(n).getDay()));return n}
  if(r==="weekends"){do n=addDays(n,1);while(![0,6].includes(parse(n).getDay()));return n}
  if(r==="weekly")return addDays(n,7);
  if(r==="biweekly")return addDays(n,14);
  if(r==="monthly")return addMonths(n,1);
  if(r==="quarterly")return addMonths(n,3);
  if(r==="semester")return addMonths(n,6);
  if(r==="custom")return t.unit==="day"?addDays(n,t.every):t.unit==="week"?addDays(n,7*t.every):addMonths(n,t.every);
  return null;
}
/* does an open repeating task fall on this date (for the calendar panel) */
function occursOn(t,date){if(t.done||!t.repeat||t.repeat==="never"||date<t.due)return date===t.due;let d=t.due,i=0;while(d<date&&i<400){d=nextDue(t,d);i++}return d===date}

/* ---------- Scoring ----------
   section score = Σ weight(Sí) / Σ weight(Sí + No)   (N/A excluded)
   total = Σ section% × section score / Σ section% of answered sections */
function score(tpl,ans){
  let tw=0,ts=0;const secs=tpl.sections.map(s=>{let y=0,a=0,no=0;s.qs.forEach(q=>{const v=ans[q.id];if(v==="yes"){y+=q.w;a+=q.w}else if(v==="no"){a+=q.w;no++}});
    const sc=a?y/a:null;if(sc!=null){tw+=s.weight;ts+=s.weight*sc}return{id:s.id,name:s.name,score:sc,no}});
  return{total:tw?ts/tw:null,secs};
}
/* cycle count:
   "units" → 1 − Σ|físico − sistema| / Σ sistema   (exactitud en unidades)
   "refs"  → referencias sin diferencia (dentro de la tolerancia) / referencias contadas */
function countScore(tpl,rows){
  let sys=0,dif=0,exact=0,n=0;
  (rows||[]).forEach(r=>{if(r.sys===""||r.fis===""||r.sys==null||r.fis==null)return;const s=+r.sys,f=+r.fis;n++;sys+=s;dif+=Math.abs(f-s);if(Math.abs(f-s)<=s*(tpl.tol||0)/100)exact++});
  const total=!n?null:tpl.method==="refs"?exact/n:Math.max(0,1-dif/Math.max(sys,1));
  return{total,n,exact,dif,sys};
}

/* ---------- Calendar ---------- */
/* scope: Usuario sees only his own work; Administrador and above see the whole module */
const ownTask=t=>isAdmin()||asg(t).includes(S.user.id);
function visibleEvents(){return EVENTS.filter(e=>inMod(e.mods)&&storeOk(e.store)&&(isAdmin()||e.assignee===S.user.id))}
const byTime=(a,b)=>(a.time||"99")<(b.time||"99")?-1:1;
// visits and audits not yet done can be dragged to another day (data-drag); done ones stay put
function chipHtml(e){const st=status(e),sc=evScore(e);
  return `<span class="chip ${st} ${e.kind==="inspeccion"?"insp":""}" ${e.doneAt?"":`data-drag="ev"`} data-act="open-ev" data-id="${e.id}" role="button" tabindex="0" title="${esc(e.time||"")} ${esc(e.store)} · ${STLBL[st]}">
    <span class="t">${e.time?`<span class="hr">${e.time}</span> `:""}${esc(e.store)}${aisleTag(e)}</span><span class="s">${isCount(tplById(e.tpl))?'<span class="ins cont">CONT</span>':(e.kind==="inspeccion"?'<span class="ins">INSP</span>':"")}${sc!=null?pct(sc):(st==="r"?"No realizada":st==="b"?"Realizada":"Pendiente")}</span></span>`}
const dayTaskList=ds=>TASKS.filter(t=>inMod([t.mod])&&ownTask(t)&&!t.done&&storeOk(t.store)&&(t.due===ds||(ds>t.due&&occursOn(t,ds)))).sort(byTime);
const taskChip=t=>`<span class="tchip" data-act="open-task" data-id="${t.id}" role="button" tabindex="0" title="${esc(t.title)}">✓ ${t.time?t.time+" ":""}${esc(t.title)}</span>`;
function calStep(dir){
  if(S.calView==="month"){S.month=new Date(S.month.getFullYear(),S.month.getMonth()+dir,1);return}
  S.sel=addDays(S.sel,dir*(S.calView==="week"?7:1));S.month=new Date(parse(S.sel).getFullYear(),parse(S.sel).getMonth(),1);
}
function viewCal(){
  const evs=visibleEvents();const byDay={};evs.forEach(e=>(byDay[e.date]=byDay[e.date]||[]).push(e));Object.values(byDay).forEach(l=>l.sort(byTime));
  const y=S.month.getFullYear(),m=S.month.getMonth();
  const mon=evs.filter(e=>{const d=parse(e.date);return d.getMonth()===m&&d.getFullYear()===y});
  const cnt=k=>mon.filter(e=>status(e)===k).length;
  const dayList=(byDay[S.sel]||[]);
  const wk0=addDays(S.sel,-((parse(S.sel).getDay()+6)%7));
  const title=S.calView==="month"?`${MES[m]} ${y}`:S.calView==="week"?`${fmtD(wk0).replace(" 2026","")} – ${fmtD(addDays(wk0,6))}`:`${DAYS[(parse(S.sel).getDay()+6)%7]} ${fmtD(S.sel)}`;
  let body="";
  if(S.calView==="month"){
    const first=new Date(y,m,1);const start=new Date(y,m,1-((first.getDay()+6)%7));let cells="";
    for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=iso(d);const list=byDay[ds]||[];
      if(i>=35&&d.getMonth()!==m)break;
      cells+=`<div class="cal-day ${d.getMonth()!==m?"out":""} ${ds===TODAY_ISO?"today":""} ${ds===S.sel?"sel":""}" data-act="sel-day" data-d="${ds}" data-drop-d="${ds}">
        <div class="dnum"><b>${d.getDate()}</b></div>${S.mod==="cmp"?pChips(ds):S.mod==="prd"?prChips(ds):""}${list.slice(0,3).map(chipHtml).join("")}${list.length>3?`<span class="more">+${list.length-3} más</span>`:""}${(tk=>tk.slice(0,2).map(taskChip).join("")+(tk.length>2?`<span class="more">+${tk.length-2} tareas</span>`:""))(dayTaskList(ds))}</div>`}
    body=`<div class="cal-grid">${DAYS.map(d=>`<div class="cal-dow">${d}</div>`).join("")}${cells}</div>`;
  }else if(S.calView==="week"){
    body=`<div class="cal-grid week">${[0,1,2,3,4,5,6].map(i=>{const ds=addDays(wk0,i);const d=parse(ds);return `<div class="cal-dow ${ds===TODAY_ISO?"today-h":""}">${DAYS[i]} ${d.getDate()}</div>`}).join("")}
      ${[0,1,2,3,4,5,6].map(i=>{const ds=addDays(wk0,i);const tk=dayTaskList(ds);return `<div class="cal-day wk ${ds===S.sel?"sel":""}" data-act="sel-day" data-d="${ds}" data-drop-d="${ds}">${(byDay[ds]||[]).map(chipHtml).join("")}${tk.map(taskChip).join("")}</div>`}).join("")}</div>`;
  }else{
    const tk=dayTaskList(S.sel);const hours=[];for(let h=6;h<=21;h++)hours.push(String(h).padStart(2,"0"));
    const at=h=>[...dayList.filter(e=>(e.time||"").slice(0,2)===h).map(chipHtml),...tk.filter(t=>(t.time||"").slice(0,2)===h).map(taskChip)].join("");
    const noTime=[...dayList.filter(e=>!e.time).map(chipHtml),...tk.filter(t=>!t.time).map(taskChip)].join("");
    body=`<div class="dayview">${noTime?`<div class="slot"><span class="hh">Sin hora</span><div class="slot-c">${noTime}</div></div>`:""}
      ${hours.map(h=>`<div class="slot" data-drop-d="${S.sel}" data-drop-h="${h}:00"><span class="hh">${h}:00</span><div class="slot-c">${at(h)}</div></div>`).join("")}</div>`;
  }
  return `<div class="page-head"><div><div class="eyebrow">${MODULES.find(x=>x.id===S.mod).name}</div><h1>${S.mod==="cmp"?"Calendario de compras":S.mod==="prd"?"Calendario de producción":S.mod==="com"?"Visitas y reuniones":"Calendario de visitas"}</h1></div>
    <div class="legend">${[["y","Programada"],["b","Completada"],["r","No realizada"]].map(([k,l])=>`<button class="lg-btn" data-act="cal-status" data-k="${k}" title="Ver la lista"><span class="dot" style="background:var(--${k}-bar)"></span>${l} · ${cnt(k)}</button>`).join("")}${S.mod==="com"?"":`<span><span class="ins" style="font-size:9px;font-weight:800;padding:0 4px;border-radius:3px;background:var(--b-bar);color:#fff">INSP</span>Inspección (sin programar)</span>`}</div></div>
  <div class="cal-wrap">
    <div class="cal">
      <div class="cal-head"><div class="row"><button class="btn sm" data-act="calnav" data-d="-1" aria-label="Anterior">‹</button><button class="btn sm" data-act="calnav" data-d="0">Hoy</button><button class="btn sm" data-act="calnav" data-d="1" aria-label="Siguiente">›</button></div>
        <h2>${title}</h2><div class="seg">${[["month","Mes"],["week","Semana"],["day","Día"]].map(([k,l])=>`<button class="${S.calView===k?"on":""}" data-act="calview" data-k="${k}">${l}</button>`).join("")}</div></div>
      ${body}
      <p class="example-note" style="padding:8px 14px;margin:0">Arrastra una visita o auditoría pendiente a otro día${S.calView==="day"?" u hora":""} para moverla.</p>
    </div>
    <div class="agenda">
      <div class="row" style="justify-content:space-between"><div><div class="eyebrow">Día seleccionado</div><h2 style="font-size:17px">${fmtD(S.sel)}</h2></div>
        ${S.mod==="cmp"?`<button class="btn primary sm" data-act="new" data-k="purch">Nueva solicitud</button>`:S.mod==="prd"?`<button class="btn primary sm" data-act="new" data-k="porder">Nueva orden</button>`:S.mod==="com"?`<button class="btn primary sm" data-act="new" data-k="meet-now">Registrar visita aquí</button>`:`<button class="btn primary sm" data-act="quick-audit" data-d="${S.sel}">Auditar aquí</button>`}</div>
      <div class="eyebrow">${S.mod==="cmp"?"Solicitudes de compra del día":S.mod==="prd"?"Producción del día":S.mod==="com"?"Visitas y reuniones":"Auditorías y conteos"}</div>
      ${S.mod==="cmp"?pDay(S.sel):S.mod==="prd"?prDay(S.sel):dayList.length?dayList.map(visitCard).join(""):`<div class="card empty">${S.mod==="com"?"Sin visitas ni reuniones este día.":"Sin visitas este día.<br>Usa “Auditar aquí” para hacer una inspección o el botón + para programar."}</div>`}
      ${dayTasks()}
      <p class="example-note">Cada visita programada se crea también en tu calendario de Outlook.</p>
    </div>
  </div>`;
}
/* the month's visits and audits in one state (from the counters above the calendar) */
function openStatusList(k){const y=S.month.getFullYear(),m=S.month.getMonth();
  const l=visibleEvents().filter(e=>{const d=parse(e.date);return d.getMonth()===m&&d.getFullYear()===y&&status(e)===k}).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:byTime(a,b));
  sheet(`<div class="sheet-h"><div><div class="eyebrow">${MES[m]} ${y}</div><h2>${{y:"Programadas",b:"Completadas",r:"No realizadas"}[k]} · ${l.length}</h2></div><button class="icon-btn" data-act="close" aria-label="Cerrar">✕</button></div>
   ${l.map(e=>`<div class="muted" style="font-size:12px;margin-top:4px">${fmtD(e.date)}</div>${visitCard(e)}`).join("")||'<div class="empty">No hay ninguna en este mes.</div>'}`)}
function moveEvent(id,date,time){
  const e=EVENTS.find(x=>x.id===id);if(!e)return;
  if(e.doneAt)return toast("Ya está realizada; no se puede mover");
  if(date<TODAY_ISO)return toast("No se puede mover a una fecha pasada");
  if(date===e.date&&(!time||time===e.time))return;
  (e.log=e.log||[]).push({by:S.user.id,at:TODAY_ISO,text:`Movida del ${fmtD(e.date)}${e.time?" "+e.time:""} al ${fmtD(date)}${time||e.time?" "+(time||e.time):""}`});
  e.date=date;if(time)e.time=time;S.sel=date;toast(`${e.store} movida al ${fmtD(date)}${time?" a las "+time:""} · actualizada en Outlook`);
}
/* tasks under the day's visits: due that day, plus overdue ones when looking at today */
function dayTasks(){
  const mine=TASKS.filter(t=>inMod([t.mod])&&ownTask(t)&&!t.done&&storeOk(t.store));
  const due=mine.filter(t=>t.due===S.sel||(S.sel>t.due&&occursOn(t,S.sel))),late=mine.filter(t=>t.due<TODAY_ISO&&!due.includes(t));
  return `<div class="row" style="justify-content:space-between;margin-top:6px"><div class="eyebrow">Tareas del día</div><button class="btn sm" data-act="new" data-k="task">+ Tarea</button></div>
    <div class="card" style="padding:4px 14px">${due.length?due.map(t=>taskRow(t,t.due!==S.sel)).join(""):'<div class="empty" style="padding:12px">Sin tareas para este día.</div>'}</div>
    ${late.length?`<div class="eyebrow" style="color:var(--r)">Vencidas · ${late.length}</div><div class="card" style="padding:4px 14px">${late.map(t=>taskRow(t)).join("")}</div>`:""}`;

function visitCard(e){const st=status(e),sc=evScore(e);const bar={y:"var(--y-bar)",b:"var(--b-bar)",r:"var(--r-bar)"}[st];

/* ---------- Audit runner ---------- */
let RUN=null;
function startRun(e){
  const tpl=tplById(e.tpl);
  RUN={ev:e,answers:{...(e.answers||{})},notes:{},tasks:{},tdue:{},ttime:{},photos:JSON.parse(JSON.stringify(e.photos||{})),gnote:"",
    rows:(e.rows||e.products||tpl.products||[]).map(r=>({sku:r.sku,name:r.name,sys:r.sys??"",fis:r.fis??""})),adjTask:true,adjUser:e.assignee||S.user.id,
    checks:{...(e.checks||{})},obs:{...(e.obs||{})},stage:"",extra:[],comp:e.companion?{on:true,...e.companion}:{on:false,name:"",cargo:""}};
  // whole warehouse by aisle: one set of answers per aisle (an edit keeps the aisles it was done with)
  if(e.aisle==="*"&&!isCount(tpl)&&!isVisit(tpl)){const as=e.partNames?Object.entries(e.partNames).map(([id,name])=>({id,name,resp:e.partResp?.[id]||""})):aislesOf(e.store).map(a=>({...a}));
    if(as.length){RUN.aisles=as;RUN.cur=as[0].id;if(e.parts)RUN.answers=Object.fromEntries(Object.entries(e.parts).flatMap(([aid,a])=>Object.entries(a).map(([q,v])=>[aid+"|"+q,v])))}}
  S.view="run";renderApp();
}
function runHeader(e,tpl,label,val,sub){

function dashData(){
  const {from,to,store}=S.dash;
  const evs=visibleEvents().filter(e=>e.date>=from&&e.date<=to&&(store==="all"||e.store===store)&&e.tpl==="t1");
  const done=evs.filter(e=>status(e)==="b"),miss=evs.filter(e=>status(e)==="r"),sched=evs.filter(e=>e.kind==="programada"&&e.date<TODAY_ISO);
  const scores=done.map(evScore);const avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:null;
  const tpl=tplById("t1");
  const secAgg=tpl.sections.map(s=>{const v=done.map(e=>score(tpl,e.answers).secs.find(x=>x.id===s.id).score).filter(x=>x!=null);return{name:s.name,weight:s.weight,v:v.length?v.reduce((a,b)=>a+b,0)/v.length:null}});
  const months={};done.forEach(e=>{const k=e.date.slice(0,7);(months[k]=months[k]||[]).push(evScore(e))});
  const trend=Object.keys(months).sort().map(k=>({k,v:months[k].reduce((a,b)=>a+b,0)/months[k].length,n:months[k].length}));
  const qFail={};done.forEach(e=>tpl.sections.forEach(s=>s.qs.forEach(q=>{if(e.answers[q.id]==="no")qFail[q.t]=(qFail[q.t]||0)+1})));
  const topFail=Object.entries(qFail).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const stores=myStores().map(st=>{const d=done.filter(e=>e.store===st).sort((a,b)=>a.date<b.date?1:-1);const v=d.map(evScore);
    return{st,n:d.length,avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:null,last:v[0]??null,prev:v[1]??null,miss:miss.filter(e=>e.store===st).length}}).filter(x=>store==="all"||x.st===store).sort((a,b)=>(b.avg??-1)-(a.avg??-1));
  const crit=done.filter(e=>tpl.sections.some(s=>s.qs.some(q=>q.crit&&e.answers[q.id]==="no"))).length;
  const nos=done.reduce((a,e)=>a+Object.values(e.answers).filter(v=>v==="no").length,0);
  return{evs,done,miss,sched,avg,secAgg,trend,topFail,stores,crit,nos,insp:done.filter(e=>e.kind==="inspeccion").length};
}
function countData(){
  const {from,to,store}=S.dash;
  const list=visibleEvents().filter(e=>e.doneAt&&isCount(tplById(e.tpl))&&e.date>=from&&e.date<=to&&(store==="all"||e.store===store));
  const avgOf=a=>{const v=a.map(evScore).filter(x=>x!=null);return v.length?v.reduce((x,y)=>x+y,0)/v.length:null};
  const dif={};let difRefs=0;
  list.forEach(e=>(e.rows||[]).forEach(r=>{const d=Math.abs(+r.fis-+r.sys);if(r.sys!==""&&r.fis!==""&&d){difRefs++;const k=r.sku+" · "+r.name;(dif[k]=dif[k]||{label:k,n:0,u:0}).n++;dif[k].u+=d}}));

  while(parse(a)<=last){const days=[0,1,2,3,4,5,6].filter(i=>parse(addDays(a,i)).getMonth()===m-1).length;out.push({k:a,a,b:addDays(a,6),days,share:days/last.getDate()});a=addDays(a,7)}return out}

function countAgg(list){

}

function countTrend(done,from,to){

/* ---------- CRM ---------- */
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const clientTasks=d=>TASKS.filter(t=>t.store===d.client);
/* last activity: any conversation, stage change, task created or completed for the client */
const lastTouch=d=>[d.created,d.moved,...d.acts.map(a=>a.date),...clientTasks(d).flatMap(t=>[t.createdAt,t.doneAt,...(t.history||[]).map(h=>h.at)])].filter(Boolean).sort().at(-1);
const isOpen=d=>!["Ganado","Perdido"].includes(d.stage);
/* board state: Freezer after N days without activity; "atrasado" when a stage's follow-up time is exceeded */
function dealState(d){
  const idle=daysBetween(lastTouch(d),TODAY_ISO);
  const frozen=isOpen(d)&&idle>PARAMS.crm.freezer;
  const late=isOpen(d)&&!frozen&&idle>(PARAMS.crm.maxDays[d.stage]??999);
  return{idle,frozen,late,col:frozen?"Freezer":d.stage};
}
const inRange=d=>{const {from,to}=S.crm;return [d.created,d.moved,...d.acts.map(a=>a.date)].some(x=>x&&x>=from&&x<=to)};
// sales executives: commercial users (Gerencia only when it owns deals)
const EXECS=()=>isAdmin()?TEAM.filter(u=>(u.active!==false&&u.mods.includes("com")&&u.role==="user")||DEALS.some(d=>d.owner===u.id)):TEAM.filter(u=>u.id===S.user.id);

function readLead(px,f,client){const v=id=>(document.getElementById(px+id)?.value||"").trim();

/* moving a deal: rating is required to advance, Perdido needs a reason and an admin, Freezer is automatic */
function moveDeal(d,stage){
  if(!d||d.stage===stage&&!dealState(d).frozen)return false;
  if(stage==="Freezer"){toast("Freezer se asigna solo, por inactividad");return false}
  if(!d.rating){toast("Pon la calificación AAA, A, B o C del cliente antes de avanzar");openDeal(d.id);return false}
  if(stage==="Perdido"){askLost(d);return false}
  d.acts.push({id:nid("a"),type:"Etapa",date:TODAY_ISO,text:`${dealState(d).col} → ${stage}`,by:S.user.id});d.stage=stage;d.moved=TODAY_ISO;
  if(stage!=="Prospecto"&&d.contactStatus!=="Contactado")d.contactStatus="Contactado";
  return true;
}

/* admin alerts: lost deals to approve, deals in Freezer, leave requests */

const DAYS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const WEEK_START=addDays(TODAY_ISO,-((TODAY.getDay()+6)%7));
const toMin=h=>{const [a,b]=h.split(":").map(Number);return a*60+b},toHH=m=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
function defaultTimes(store){const h=HOURS[store],o=toMin(h.open),c=toMin(h.close),mid=Math.round((o+c)/2/30)*30;return{one:[h.open,h.close],T1:[h.open,toHH(mid)],T2:[toHH(mid),h.close]}}
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};

/* leave requests: pending until an admin approves; approved ones show as P in the roster */
const PERM_TYPES=["Permiso personal","Cita médica","Calamidad doméstica","Vacaciones","Licencia","Incapacidad"];
const PERMISOS=[
 {id:nid("pm"),person:"p2",type:"Cita médica",from:"2026-11-18",to:"2026-11-18",hours:"08:00–11:00",note:"Control médico de rutina.",status:"Aprobado",by:"u2",at:"2026-11-10",dec:"u1"},

 {id:nid("pm"),person:"p9",type:"Vacaciones",from:"2026-11-23",to:"2026-11-28",hours:"",note:"Vacaciones programadas.",status:"Pendiente",by:"u5",at:"2026-11-11"}
];
const permitOn=(pid,ds,st="Aprobado")=>PERMISOS.find(p=>p.person===pid&&p.status===st&&ds>=p.from&&ds<=p.to);

/* random roster: Sunday is everyone's rest day; Monday to Saturday each person keeps one shift.
   People are shuffled into the shifts; extra people go where coverage is thinnest. */
function suggestMalla(store,turnos,per,times){
  const ppl=shuffle(NOMINA.filter(p=>p.store===store)),open=HOURS[store].days;
  const need=turnos===1?[per[0]]:[per[0],per[1]],groups=need.map(()=>[]);
  ppl.forEach(p=>{let g=groups.findIndex((gr,k)=>gr.length<need[k]);if(g<0)g=groups.map((gr,k)=>gr.length/need[k]).indexOf(Math.min(...groups.map((gr,k)=>gr.length/need[k])));groups[g].push(p)});
  const grid={};groups.forEach((gr,k)=>gr.forEach(p=>grid[p.id]=[0,1,2,3,4,5,6].map(d=>d===6?"D":open[d]?"T"+(k+1):"X")));
  return{turnos,per:need,times,grid};
}
function cellCode(m,pid,d){const c=m.grid[pid]?.[d];if(c==="X"||c==="D")return c;return permitOn(pid,addDays(WEEK_START,d))?"P":c}
function mallaWarnings(store,m){const ppl=NOMINA.filter(p=>p.store===store&&m.grid[p.id]),w=[];
  m.per.forEach((n,k)=>{const have=ppl.filter(p=>m.grid[p.id].some(c=>c==="T"+(k+1))).length;if(have<n)w.push(`Turno ${k+1}: hay ${have} persona(s) y se necesitan ${n}.`)});
  [0,1,2,3,4,5].forEach(d=>{if(!HOURS[store].days[d])return;m.per.forEach((n,k)=>{const c=ppl.filter(p=>cellCode(m,p.id,d)==="T"+(k+1)).length;if(c<n)w.push(`${DAYS[d]} ${parse(addDays(WEEK_START,d)).getDate()}: turno ${k+1} queda con ${c} de ${n} (permisos o cambios).`)})});
  return w;
}

/* evaluation: base per month; tasks done add points; each day a task stays undone subtracts;
   finishing it late gives a point back; reported faults subtract by type */
const levelsOf=()=>[[EVAL.levels.top,"Destacado","g"],[EVAL.levels.ok,"Cumple","b"],[EVAL.levels.watch,"En observación","y"],[-1,"Plan de mejora","r"]];
function penaltyDays(t,ym){
  const segs=[];
  (t.reprog||[]).forEach(r=>{if(r.at>r.from)segs.push([r.from,addDays(r.at,-1)])});
  (t.history||[]).forEach(h=>{if(h.at>h.due)segs.push([h.due,addDays(h.at,-1)])});
  if(t.done&&t.doneAt>t.due)segs.push([t.due,addDays(t.doneAt,-1)]);
  if(!t.done&&t.due<TODAY_ISO)segs.push([t.due,addDays(TODAY_ISO,-1)]);
  let n=0;segs.forEach(([a,b])=>{for(let d=a;d<=b;d=addDays(d,1))if(inPer(d))n++});return n;
}
function evalPerson(pid,ym){
  const inM=inPer;let onTime=0,late=0,days=0;const items=[];
  TASKS.filter(t=>asg(t).includes(pid)).forEach(t=>{
    (t.history||[]).filter(h=>inM(h.at)).forEach(h=>{if(h.at<=h.due){onTime++;items.push([h.at,`Tarea a tiempo: ${t.title}`,EVAL.onTime])}else{late++;items.push([h.at,`Tarea hecha tarde (recupera): ${t.title}`,EVAL.lateRecover])}});
    if(t.done&&inM(t.doneAt)){if(t.doneAt<=t.due){onTime++;items.push([t.doneAt,`Tarea a tiempo: ${t.title}`,EVAL.onTime])}else{late++;items.push([t.doneAt,`Tarea hecha tarde (recupera): ${t.title}`,EVAL.lateRecover])}}
    const pd=penaltyDays(t,ym);if(pd){days+=pd;items.push([t.done?t.doneAt:TODAY_ISO,`${pd} día(s) sin completar: ${t.title}`,-pd*EVAL.dayPenalty])}});
  const seen={};let pen=0,faults=0;
  INCIDENTS.filter(n=>n.person===pid&&inM(n.date)).sort((a,b)=>a.date<b.date?-1:1).forEach(n=>{const k=EVAL.faults[n.type]!=null?n.type:"Otro";const w=EVAL.faults[k];
    if(!w){items.push([n.date,`${n.type}: ${n.text}`,0]);return}
    seen[k]=(seen[k]||0)+1;faults++;const p=w*(seen[k]>=EVAL.repeatFrom?2:1);pen+=p;items.push([n.date,`${n.type}${seen[k]>=EVAL.repeatFrom?" (reincidencia, cuenta doble)":""}: ${n.text}`,-p])});
  // grade of the aisles this person is responsible for: adds or subtracts by range (Parametrización)
  let aisleP=0;const A=EVAL.aisle||{top:90,plus:2,low:75,minus:3};
  EVENTS.filter(e=>e.doneAt&&inM(e.date)).forEach(e=>aisleResults(e).forEach(r=>{if(r.resp!==pid||r.score==null)return;const p=r.score>=A.top/100?A.plus:r.score<A.low/100?-A.minus:0;aisleP+=p;items.push([e.date,`${aisleLbl(r.name)} (${e.store}): ${pct(r.score)}`,p])}));
  const bonus=Math.min(EVAL.bonusCap,onTime*EVAL.onTime+late*EVAL.lateRecover);
  const score=Math.max(0,Math.min(EVAL.base+EVAL.bonusCap,EVAL.base+bonus+aisleP-days*EVAL.dayPenalty-pen));
  const lv=levelsOf().find(l=>score>=l[0]);
  return{onTime,late,days,faults,pen,bonus,aisleP,score,level:lv[1],tone:lv[2],items:items.sort((a,b)=>a[0]<b[0]?1:-1)};
}

/* ---------- Compras: solicitudes de abastecimiento (SA) y compra especial (CE) ----------
   Flujo: Por confirmar (Administrador Comercial o Gerencia) → Pendiente (Compras cotiza y escribe el valor) →
   Cotizado por autorizar (Administrador de Compras hasta el tope; por encima del tope y toda SA, Gerencia o Superusuario) →
   Autorizado (Compras genera la OC) → Solicitado (espera la llegada) → Completado (se valida lo que llegó).
   Rechazada: al confirmar o al autorizar, siempre con el motivo. Todo queda en la trazabilidad, visible para todos. */
const P_COLS=["Por confirmar","Pendiente","Cotizado por autorizar","Autorizado","Solicitado","Completado","Rechazada"];
const P_NEXT={"Por confirmar":"Pendiente",Pendiente:"Cotizado por autorizar","Cotizado por autorizar":"Autorizado",Autorizado:"Solicitado",Solicitado:"Completado"};
const P_TYPES={CE:"Compra especial",SA:"Abastecimiento"};
const P_DONE=["Completado","Rechazada"];
const PR=(o)=>({id:nid("pr"),num:0,items:[],clientOC:"",accepted:true,status:"Por confirmar",value:0,po:"",buyDate:"",eta:"",invBuy:"",arrived:"",needBy:"",history:[],tasks:[],...o});
const PURCH=[];
const pTone={"Por confirmar":"y",Pendiente:"y","Cotizado por autorizar":"y",Autorizado:"b",Solicitado:"b",Completado:"g",Rechazada:"r"};
const FIRE='<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 2c1 3.5-1.5 5-2.5 7.2C8.6 11 9.2 13 10.5 13.6 9.8 11.4 11 10 12.4 9c-.2 2.5 1.9 3.6 1.9 6.1A3.3 3.3 0 0 1 11 18.4c3.6 1.2 7-1.2 7-5.1 0-4.6-3.8-6.6-6-11.3zM6.3 11.6C5.4 13 5 14.4 5 15.6 5 19.1 8 22 12 22c-3-.9-4.6-3.6-3.7-6.8-1.4-.6-2.1-2-2-3.6z"/></svg>';
const nextNum=a=>Math.max(0,...a.map(x=>x.num||0))+1;
const fmtS=s=>s?fmtD(s).replace(" "+TODAY.getFullYear(),""):"—";
const fmtTS=(ts,d)=>{if(!ts)return d?fmtD(d):"—";const x=new Date(ts);return `${fmtD(iso(x))} · ${x.toTimeString().slice(0,5)}`};
/* who does what */
const isTop=u=>isOwner(u)||u?.role==="gerencia";
const isAdminOf=(u,m)=>u?.role==="admin"&&(u.mods||[]).includes(m);
const canConfirm=()=>isTop(S.user)||isAdminOf(S.user,"com");
const canBuy=()=>isTop(S.user)||S.user.mods.includes("cmp");
const overLimit=p=>p.type==="SA"||(+p.value||0)>PARAMS.purch.authLimit;
const canAuthorize=p=>isTop(S.user)||(!overLimit(p)&&isAdminOf(S.user,"cmp"));
const seesConfirm=()=>canConfirm()||isAdminOf(S.user,"cmp");
const canEditP=p=>isTop(S.user)||(p.status==="Por confirmar"&&(canConfirm()||p.seller===S.user.id))||(canBuy()&&!P_DONE.includes(p.status));
const orTop=a=>a.length?a:activeTeam().filter(u=>u.role==="gerencia");
const confirmers=()=>orTop(activeTeam().filter(u=>isAdminOf(u,"com")));
const buyers=()=>orTop((x=>x.length?x:activeTeam().filter(u=>isAdminOf(u,"cmp")))(activeTeam().filter(u=>u.role==="user"&&u.mods.includes("cmp"))));
const authorizers=p=>overLimit(p)?activeTeam().filter(u=>u.role==="gerencia"):orTop(activeTeam().filter(u=>isAdminOf(u,"cmp")));
const pLog=(p,text,red)=>(p.history=p.history||[]).push({at:TODAY_ISO,ts:new Date().toISOString(),by:S.user.id,text,red:!!red});
/* requests made with version 1 lack fields of the new flow (and the very first one got no number): complete them so they can be opened and moved */
function fixPurch(){
  PURCH.filter(p=>p.num==null||!(p.num>0)).sort((a,b)=>(a.date||"")<(b.date||"")?-1:1).forEach(p=>{p.num=nextNum(PURCH.filter(x=>x.num>0));(p.history=p.history||[]).push({at:TODAY_ISO,by:S.user.id,text:`Se asignó el número #${p.num} (solicitud creada antes de la versión 2)`})});
  PURCH.forEach(p=>{if(!Array.isArray(p.tasks))p.tasks=p.task?[p.task]:[];if(!p.moved)p.moved=p.date||TODAY_ISO;if(!Array.isArray(p.history))p.history=[];if(!Array.isArray(p.items))p.items=[];if(p.needBy==null)p.needBy="";if(p.value==null)p.value=0;["po","buyDate","eta","invBuy","arrived","clientOC"].forEach(k=>{if(p[k]==null)p[k]=""})});
  PORDERS.forEach(o=>{if(!Array.isArray(o.tasks))o.tasks=[];if(!Array.isArray(o.history))o.history=[];if(!Array.isArray(o.items))o.items=[]});
}
/* time allowed in each state (Parametrización); Solicitado is due on the estimated arrival date */
function pDue(p){if(P_DONE.includes(p.status))return null;if(p.status==="Solicitado")return p.eta||null;return addDays(p.moved||p.date,PARAMS.purch.stageDays[p.status]??1)}
const pLate=p=>{const d=pDue(p);return!!d&&TODAY_ISO>d};
const onTime=p=>p.arrived&&p.needBy?p.arrived<=p.needBy:null;
const pAge=p=>daysBetween(p.date,p.doneAt||TODAY_ISO);
/* each step becomes a task (with its deadline) for the people who must act, and an Outlook notice */
function pTask(p,title,who,mod,days){if(!who.length)return;const t=TK(title,p.branch,who[0].id,addDays(TODAY_ISO,Math.max(0,days||0)),mod,`Solicitud de compra #${p.num}`,{assignees:who.map(u=>u.id),purch:p.id,createdAt:TODAY_ISO});TASKS.unshift(t);(p.tasks=p.tasks||[]).push(t.id)}
function pCloseTasks(p){TASKS.filter(t=>(p.tasks||[]).includes(t.id)&&!t.done).forEach(t=>{t.done=true;t.doneAt=TODAY_ISO})}
function pNotify(subject,who){if(typeof outlookNotice==="function")outlookNotice(subject,who)}
/* what needs me: shown as a count next to Compras in the menu */
function purchActs(){return PURCH.filter(p=>(p.status==="Por confirmar"&&canConfirm())||(p.status==="Cotizado por autorizar"&&canAuthorize(p))||(!isTop(S.user)&&S.user.mods.includes("cmp")&&["Pendiente","Autorizado"].includes(p.status)))}
const purchBadge=()=>purchActs().length;
function purchCard(p){const late=pLate(p),due=pDue(p),ot=onTime(p);
  return `<button class="deal pcard ${late?"late":""}" data-drag="po" data-act="open-purch" data-id="${p.id}">
   <span class="row" style="justify-content:space-between;gap:6px;flex-wrap:nowrap"><strong>#${p.num} · ${esc(p.client)}</strong><span class="pill ${p.type==="CE"?"o":"n"}">${p.type}</span></span>
   ${late?`<span class="flag warn">${FIRE} ${p.status==="Solicitado"?"No ha llegado":"Venció el tiempo"}</span>`:""}
   <span class="muted" style="font-size:12px">${esc(p.items.map(i=>`${i.qty} ${i.unit} ${i.desc}`).join(" · "))}</span>
   <span class="muted" style="font-size:12px">${esc(p.branch||"Sucursal por definir")} · ${esc(userById(p.seller).name)}</span>
   ${p.value?`<span class="val">${cop(p.value)}</span>`:""}${p.po?`<span class="muted" style="font-size:12px">OC: <strong>${esc(p.po)}</strong></span>`:""}
   <span class="row" style="justify-content:space-between;gap:6px"><span class="muted num" style="font-size:12px">Se necesita ${fmtS(p.needBy)}</span>${due?`<span class="pill ${late?"r":"n"}">${p.status==="Solicitado"?"Llega":"Vence"} ${fmtS(due)}</span>`:p.status==="Completado"&&ot!=null?`<span class="pill ${ot?"g":"r"}">${ot?"A tiempo":"Tarde"}</span>`:""}</span></button>`}
/* the board works like the CRM pipeline: one column per state; Completado and Rechazadas show the chosen period */
function pBoard(){
  const cols=P_COLS.filter(s=>s!=="Por confirmar"||seesConfirm());
  const col=s=>PURCH.filter(p=>p.status===s&&(!P_DONE.includes(s)||inPer(p.doneAt))).sort((a,b)=>a.num-b.num);
  return `<p class="example-note" style="margin:0">Arrastra una tarjeta a la siguiente columna o ábrela para gestionarla. En rojo con ${FIRE}, las que pasaron el tiempo de su estado (se ajusta en Parametrización).</p>
  <div class="kanban pboard">${cols.map(s=>{const ds=col(s);return `<div class="col ${s==="Rechazada"?"rej-col":""}" data-pcol="${s}"><div class="col-h"><span>${s==="Rechazada"?"Rechazadas":s}</span><span class="muted">${ds.length}${P_DONE.includes(s)?" · en el periodo":""}</span></div>${ds.map(purchCard).join("")}</div>`}).join("")}</div>`;
}

/* the step the request is in, with the action of whoever can take it */
function pStep(p){
  const box=(html,tone)=>`<div class="card" style="display:grid;gap:10px;background:var(--${tone||"surface-2"})">${html}</div>`;
  const who=t=>`<div class="muted" style="font-size:13px">${t}</div>`;
  if(p.status==="Por confirmar")return canConfirm()?box(`<strong>Esta solicitud espera tu confirmación.</strong>${who("Revisa los productos y la fecha. Puedes editarla antes de confirmar.")}
     <div class="row"><button class="btn primary" data-act="p-go" data-id="${p.id}" data-s="Pendiente">Confirmar</button><button class="btn" data-act="p-edit" data-id="${p.id}">Editar</button><button class="btn" data-act="p-go" data-id="${p.id}" data-s="Rechazada">Rechazar</button></div>`,"y-bg")
    :box(who(`Espera la confirmación del Administrador Comercial o de Gerencia (${esc(confirmers().map(u=>u.name).join(", "))}).`));
  if(p.status==="Pendiente")return canBuy()?box(`<strong>Cotizar</strong><div class="field"><label for="p-branch">Sucursal *</label><select id="p-branch"><option value="">Elige la sucursal…</option>${opts(STORES,p.branch)}</select></div><div class="field"><label for="p-val">Valor compra (COP) *</label><input id="p-val" type="number" min="0" step="1000" inputmode="numeric" value="${p.value||""}" placeholder="Ej.: 3500000"></div>
     ${who(`Hasta ${cop(PARAMS.purch.authLimit)} la autoriza el Administrador de Compras; por encima${p.type==="SA"?" (y toda solicitud de abastecimiento)":""}, Gerencia.`)}
     <div class="row"><button class="btn primary" data-act="p-go" data-id="${p.id}" data-s="Cotizado por autorizar">Enviar a autorizar</button></div>`,"y-bg"):box(who("Compras está cotizando esta solicitud."));
  if(p.status==="Cotizado por autorizar"){const by=overLimit(p)?(p.type==="SA"?"Gerencia o Superusuario (solicitud de abastecimiento)":`Gerencia o Superusuario (supera ${cop(PARAMS.purch.authLimit)})`):"el Administrador de Compras o Gerencia";
    return canAuthorize(p)?box(`<strong>Autorizar compra por ${cop(p.value)}</strong>${who("La autoriza "+by+".")}<div class="row"><button class="btn primary" data-act="p-go" data-id="${p.id}" data-s="Autorizado">Autorizar</button><button class="btn" data-act="p-go" data-id="${p.id}" data-s="Rechazada">Rechazar</button></div>`,"y-bg")
      :box(who(`Valor ${cop(p.value)}. Espera la autorización de ${by}.`))}
  if(p.status==="Autorizado")return canBuy()?box(`<strong>Generar la orden de compra</strong><div class="grid2"><div class="field"><label for="p-po">Orden de compra *</label><input id="p-po" value="${esc(p.po)}" placeholder="Ej.: OC-FC-2240"></div>
     <div class="field"><label for="p-bd">Fecha de compra *</label><input id="p-bd" type="date" value="${p.buyDate||TODAY_ISO}"></div><div class="field"><label for="p-eta">Fecha estimada de llegada *</label><input id="p-eta" type="date" value="${p.eta||""}" min="${TODAY_ISO}"></div></div>
     <div class="row"><button class="btn primary" data-act="p-go" data-id="${p.id}" data-s="Solicitado">Pasar a Solicitado</button></div>`,"y-bg"):box(who("Autorizada. Compras está generando la orden de compra."));
  if(p.status==="Solicitado")return canBuy()?box(`<strong>Esperando la mercancía</strong>${who(`Llegada estimada: ${fmtD(p.eta)}. Al recibirla valida productos, cantidades y valor contra la OC.`)}<div class="row"><button class="btn primary" data-act="p-go" data-id="${p.id}" data-s="Completado">Registrar llegada</button></div>`,"y-bg")
    :box(who(`Pedida con la OC ${esc(p.po)}. Llegada estimada: ${fmtD(p.eta)}.`));
  return "";
}
function openPurch(id){fixPurch();const p=PURCH.find(x=>x.id===id);if(!p)return closeSheet();const late=pLate(p),due=pDue(p),ot=onTime(p),recv=p.status==="Completado"&&p.recv;

   <div><div class="eyebrow" style="margin-bottom:6px">Trazabilidad</div>
    ${p.history.slice().reverse().map(h=>`<div style="font-size:13px;${h.red?"color:var(--r);font-weight:600":""}"><span class="muted" style="${h.red?"color:var(--r)":""}">${h.ts?fmtTS(h.ts):fmtD(h.at)} · ${esc(userById(h.by).name)}</span> · ${esc(h.text)}</div>`).join("")}
    <div class="row" style="margin-top:8px"><input id="p-nov" placeholder="Registrar una novedad o comentario…" style="flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)"><button class="btn sm" data-act="p-nov" data-id="${p.id}">Registrar</button></div></div>
   <div class="row" style="justify-content:flex-end">${canEditP(p)?`<button class="btn" data-act="p-edit" data-id="${p.id}">Editar</button>`:""}${isTop(S.user)?`<button class="btn" data-act="p-del" data-id="${p.id}" style="color:var(--r)">Eliminar</button>`:""}</div>`);
}
/* moving a request, from the board or from its sheet: one step at a time, each with its owner and required fields */
function movePurch(p,s){
  if(!p||p.status===s)return false;
  const stop=(t,focus)=>{toast(t);if(focus){openPurch(p.id);document.getElementById(focus)?.focus()}return false};
  if(s==="Rechazada"){if((p.status==="Por confirmar"&&canConfirm())||(p.status==="Cotizado por autorizar"&&canAuthorize(p))){askReject(p);return false}return stop("Solo quien confirma o autoriza puede rechazar la solicitud en este estado")}
  if(P_NEXT[p.status]!==s)return stop(P_NEXT[p.status]?`Desde ${p.status} solo puede pasar a ${P_NEXT[p.status]}`:`La solicitud ya está ${p.status.toLowerCase()}`);
  if(s==="Pendiente"&&!canConfirm())return stop("La confirma el Administrador Comercial o Gerencia");
  if(s==="Cotizado por autorizar"){if(!canBuy())return stop("La cotiza el equipo de Compras");if(!p.branch)return stop("Elige la sucursal de la compra","p-branch");if(!(+p.value>0))return stop("Escribe el valor de la compra","p-val")}
  if(s==="Autorizado"&&!canAuthorize(p))return stop(p.type==="SA"?"Las solicitudes de abastecimiento las autoriza Gerencia":overLimit(p)?`Supera ${cop(PARAMS.purch.authLimit)}: la autoriza Gerencia`:"La autoriza el Administrador de Compras o Gerencia");
  if(s==="Solicitado"){if(!canBuy())return stop("La pide el equipo de Compras");if(!p.po)return stop("Escribe el número de la orden de compra","p-po");if(!p.buyDate)return stop("Escribe la fecha de compra","p-bd");if(!p.eta)return stop("Escribe la fecha estimada de llegada","p-eta")}
  if(s==="Completado"){if(!canBuy())return stop("La recibe el equipo de Compras");openReceive(p);return false}
  setPStatus(p,s,s==="Cotizado por autorizar"?"Valor "+cop(p.value):s==="Solicitado"?`OC ${p.po} · compra ${fmtS(p.buyDate)} · llegada estimada ${fmtS(p.eta)}`:"");
  return true;
}
function setPStatus(p,s,note,red){const from=p.status;p.status=s;p.moved=TODAY_ISO;p.doneAt=P_DONE.includes(s)?TODAY_ISO:null;
  pLog(p,`${from} → ${s}${note?" · "+note:""}`,red);pCloseTasks(p);const D=PARAMS.purch.stageDays;
  if(s==="Pendiente"){pTask(p,`Cotizar solicitud de compra #${p.num} · ${p.client}`,buyers(),"cmp",D.Pendiente);pNotify(`Solicitud de compra #${p.num} confirmada: cotizar · ${p.client}`,buyers())}
  if(s==="Cotizado por autorizar"){const a=authorizers(p);pTask(p,`Autorizar compra #${p.num} · ${p.client} · ${cop(p.value)}`,a,"cmp",D["Cotizado por autorizar"]);pNotify(`Autorizar compra #${p.num} · ${p.client} · ${cop(p.value)}`,a)}
  if(s==="Autorizado"){pTask(p,`Generar orden de compra #${p.num} · ${p.client}`,buyers(),"cmp",D.Autorizado);pNotify(`Compra #${p.num} autorizada: generar la OC · ${p.client}`,buyers())}
  if(s==="Solicitado")pTask(p,`Recibir compra #${p.num} · ${p.client}`,buyers(),"cmp",daysBetween(TODAY_ISO,p.eta));
  if(P_DONE.includes(s))pNotify(`Solicitud de compra #${p.num} ${s.toLowerCase()} · ${p.client}`,[userById(p.seller)].filter(u=>u.email));
}

   <form id="f" data-k="p-reject" data-id="${p.id}" style="display:grid;gap:12px"><div class="field"><label for="rj-text">¿Por qué no se confirma o no se autoriza? *</label><textarea id="rj-text" rows="3" required placeholder="Queda en la trazabilidad y lo ve quien la solicitó"></textarea></div>

/* arrival: check products, quantities and value against the purchase order; differences stay in red */
function openReceive(p){
  sheet(`<div class="sheet-h"><div><div class="eyebrow">Registrar llegada · solicitud #${p.num} · OC ${esc(p.po)}</div><h2>${esc(p.client)}</h2><div class="muted" style="font-size:13px">Revisa que llegó todo, en las cantidades y el valor de la orden de compra. Si algo cambió, escribe lo que llegó: queda como novedad en rojo.</div></div><button class="icon-btn" data-act="close" aria-label="Cerrar">✕</button></div>
   <form id="f" data-k="p-recv" data-id="${p.id}" style="display:grid;gap:12px">
    <div class="grid2"><div class="field"><label for="rc-inv">Factura de compra *</label><input id="rc-inv" value="${esc(p.invBuy)}" required></div><div class="field"><label for="rc-date">Fecha de llegada *</label><input id="rc-date" type="date" value="${TODAY_ISO}" required></div>
     <div class="field"><label for="rc-val">Valor facturado (COP)</label><input id="rc-val" type="number" min="0" step="1000" value="${p.value||""}"></div></div>
    <div class="scroll-x"><table class="count-t"><thead><tr><th>Producto</th><th>Pedido</th><th>Llegó</th></tr></thead><tbody>${p.items.map((i,k)=>`<tr><td>${esc(i.code?i.code+" · ":"")}${esc(i.desc)}</td><td class="num">${i.qty} ${esc(i.unit)}</td><td><input id="rc-q${k}" type="number" min="0" value="${i.qty}" style="width:90px"></td></tr>`).join("")}</tbody></table></div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary" type="submit">Completar</button></div></form>`);
}
function receivePurch(f){const p=PURCH.find(x=>x.id===f.dataset.id),g=id=>document.getElementById(id).value.trim();
  if(!g("rc-inv"))return toast("Escribe la factura de compra");if(!g("rc-date"))return toast("Escribe la fecha de llegada");
  p.recv=p.items.map((i,k)=>{const v=g("rc-q"+k);return v===""?i.qty:Math.max(0,+v)});p.invBuy=g("rc-inv");p.arrived=g("rc-date");p.invValue=g("rc-val")===""?p.value:+g("rc-val");
  let nov=0;p.items.forEach((i,k)=>{if(p.recv[k]!==i.qty){pLog(p,`Novedad en la llegada: ${i.desc} · llegaron ${p.recv[k]} de ${i.qty} ${i.unit}`,true);nov++}});
  if(p.invValue!==p.value){pLog(p,`Novedad en la llegada: valor facturado ${cop(p.invValue)} frente a ${cop(p.value)} de la orden de compra`,true);nov++}
  setPStatus(p,"Completado",`Factura ${p.invBuy} · llegó el ${fmtS(p.arrived)}${onTime(p)?" (a tiempo)":" (después de la fecha en que se necesitaba)"}`);
  closeSheet();renderApp();toast(`Solicitud #${p.num} completada${nov?` · ${nov} novedad(es) en rojo`:" · llegó completa"}`);
}

   ${kpi("Abiertas hoy",open.length,`${open.filter(pLate).length} vencidas`,open.some(pLate)?"r":"")}${kpi("Valor comprado",cop(done.reduce((a,p)=>a+(p.invValue??p.value??0),0)),"Completadas en el periodo")}

function moveOrder(o,s){
  if(!o||o.status===s)return false;const stop=t=>{toast(t);openOrder(o.id);return false};
  if(s==="Rechazado"){if(!isPrdBoss())return stop("La rechaza el Administrador de Producción o Gerencia");askRejectOrder(o);return false}
  if(s==="En producción"){if(o.status!=="Solicitado")return stop("Solo una orden Solicitada pasa a En producción");if(!isPrd())return stop("La programa el equipo de Producción");
    if(!o.start||!o.delivery)return stop("Pon la fecha de inicio y la fecha de entrega");if(!o.items.length||o.items.some(i=>!i.name||!(+i.qty>0)))return stop("Revisa el nombre y la cantidad a producir de cada producto")}
  if(s==="Completado"){if(o.status!=="En producción")return stop("Primero debe estar En producción");if(!isPrdBoss())return stop("La completa el Administrador de Producción o Gerencia");
    if(o.items.some(i=>i.made===""||i.made==null))return stop("Escribe la cantidad producida de cada producto");
    o.items.forEach(i=>{if(+i.made!==+i.qty)oLog(o,`Novedad: ${i.name} · se produjeron ${i.made} de ${i.qty}`,true)})}
  if(s==="Solicitado")return stop("Una orden no vuelve a Solicitado");
  const from=o.status;o.status=s;o.moved=TODAY_ISO;o.doneAt=["Completado","Rechazado"].includes(s)?TODAY_ISO:null;oLog(o,`${from} → ${s}`);oClose(o);
  if(s==="En producción")oTask(o,`Producir OP #${o.num}${o.client?" · "+o.client:""} (entrega ${fmtS(o.delivery)})`,prdTeam(),daysBetween(TODAY_ISO,o.delivery));
  if(s==="Completado"&&o.requester&&o.origin!=="Producción")pNotify(`Orden de producción #${o.num} completada · ${o.client}`,[userById(o.requester)].filter(u=>u.email));
  return true;
}

function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=ok;s.onerror=()=>ko(new Error("no se pudo cargar el lector de Excel"));document.head.appendChild(s)})}
async function importMatrix(file){
  try{let rows;
    if(/\.(csv|txt)$/i.test(file.name)){const t=await file.text(),l0=t.split(/\r?\n/)[0]||"";const sep=l0.includes("\t")?"\t":(l0.match(/;/g)||[]).length>=(l0.match(/,/g)||[]).length?";":",";
      rows=t.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(sep).map(x=>x.replace(/^"|"$/g,"").trim()))}
    else{toast("Leyendo el archivo…");await loadXLSX();const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""})}
    // exact column names first (Código, Nombre, Unidad, Grupo, Subgrupo, Marca), then looser ones; "Cód Grupo" and similar are not the product code
    const low=r=>r.map(c=>String(c).toLowerCase().trim());const isC=c=>/^(c[oó]d(igo)?\.?|c[oó]digo (del )?(producto|art[ií]culo|item)|ref(erencia)?|sku|item)$/.test(c),isN=c=>/^(nombre|descripci[oó]n|producto|art[ií]culo)/.test(c);
    const h=rows.slice(0,15).findIndex(r=>low(r).some(isC)&&low(r).some(isN));let ci=0,ni=1,ui=-1,gi=-1,si=-1,bi=-1;
    if(h>=0){const r=low(rows[h]);ci=r.findIndex(isC);ni=r.findIndex((c,i)=>i!==ci&&isN(c));ui=r.findIndex(c=>/^(unidad|und|um|u\.m\.?|medida|unidad de medida)$/.test(c));
      gi=r.findIndex(c=>/^(grupo|l[ií]nea|categor[ií]a|familia)$/.test(c));si=r.findIndex(c=>/^sub ?grupo$|^subl[ií]nea$|^subcategor/.test(c));bi=r.findIndex(c=>/^marca$/.test(c))}
    const col=(r,i)=>i>=0?String(r[i]??"").trim():"";
    let add=0,upd=0;rows.slice(h+1).forEach(r=>{const code=col(r,ci),name=col(r,ni);if(!code&&!name)return;
      const o={code,name,unit:col(r,ui).toUpperCase(),group:col(r,gi),sub:col(r,si),brand:col(r,bi)};const x=code?PRODS.find(p=>p.code===code):null;
      if(x){["name","unit","group","sub","brand"].forEach(k=>{if(o[k])x[k]=o[k]});delete x.cat;upd++}else{PRODS.push({id:nid("mx"),...o,unit:o.unit||"UN"});add++}});
    S.mxq="";renderView();toast(`${add} producto(s) nuevo(s) · ${upd} actualizado(s)`);
  }catch(e){toast("No se pudo leer el archivo: "+e.message)}
}

document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;
  if(a==="scrim"&&ev.target!==el)return;
  switch(a){
   case"ms-login":renderLogin(2);break;
   case"enter":S.mod=el.dataset.mod;S.view="cal";document.getElementById("login").hidden=true;document.getElementById("app").hidden=false;renderApp();break;
   case"go":S.view=el.dataset.v;closeSheet();renderApp();break;
   case"calnav":{const d=+el.dataset.d;if(d===0){S.sel=TODAY_ISO;S.month=new Date(TODAY.getFullYear(),TODAY.getMonth(),1)}else calStep(d);renderView();break}
   case"calview":S.calView=el.dataset.k;renderView();break;
   case"alerts":openAlerts();break;
   case"crm-tab":S.crmTab=el.dataset.k;renderView();break;
   case"g-tab":S.gTab=el.dataset.k;renderView();break;

/* drag and drop: deals between pipeline stages, visits/audits between calendar days.
   Mouse drags at once; touch after a short press so normal scrolling still works */
let DRAG=null,DRAG_DONE=false;
document.addEventListener("pointerdown",ev=>{
  const card=ev.target.closest("[data-drag]");if(!card||ev.button>0)return;
  DRAG={type:card.dataset.drag,id:card.dataset.id,card,x:ev.clientX,y:ev.clientY,moved:false,touch:ev.pointerType!=="mouse",armed:ev.pointerType==="mouse"};
  if(DRAG.touch)DRAG.timer=setTimeout(()=>{if(DRAG){DRAG.armed=true;startGhost(DRAG.x,DRAG.y)}},280);
});
function startGhost(x,y){const d=DRAG;const r=d.card.getBoundingClientRect();const g=d.card.cloneNode(true);g.classList.add("drag-ghost");g.style.width=r.width+"px";
  d.ox=d.x-r.left;d.oy=d.y-r.top;g.style.left=x-d.ox+"px";g.style.top=y-d.oy+"px";document.body.appendChild(g);d.ghost=g;d.moved=true;d.card.classList.add("dragging")}
function dropAt(x,y){const el=document.elementFromPoint(x,y);return DRAG.type==="deal"?el?.closest(".col[data-stage]"):DRAG.type==="po"?el?.closest(".col[data-pcol]"):DRAG.type==="pr"?el?.closest(".col[data-prcol]"):el?.closest("[data-drop-d]")}
document.addEventListener("pointermove",ev=>{
  const d=DRAG;if(!d)return;
  if(!d.armed){if(Math.hypot(ev.clientX-d.x,ev.clientY-d.y)>8){clearTimeout(d.timer);DRAG=null}return}
  if(!d.moved){if(Math.hypot(ev.clientX-d.x,ev.clientY-d.y)<6)return;startGhost(ev.clientX,ev.clientY)}
  ev.preventDefault();d.ghost.style.left=ev.clientX-d.ox+"px";d.ghost.style.top=ev.clientY-d.oy+"px";
  document.querySelectorAll(".over").forEach(c=>c.classList.remove("over"));dropAt(ev.clientX,ev.clientY)?.classList.add("over");
},{passive:false});
document.addEventListener("touchmove",ev=>{if(DRAG?.moved)ev.preventDefault()},{passive:false});
function endDrag(ev){
  const d=DRAG;if(!d)return;clearTimeout(d.timer);if(!d.moved){DRAG=null;return}
  d.ghost.remove();DRAG_DONE=true;setTimeout(()=>DRAG_DONE=false,350);
  const target=ev.type==="pointerup"?dropAt(ev.clientX,ev.clientY):null;DRAG=null;
  if(d.type==="deal"){const deal=DEALS.find(x=>x.id===d.id);
    if(target&&target.dataset.stage!==dealState(deal).col){const from=dealState(deal).col;if(moveDeal(deal,target.dataset.stage))toast(`${deal.client}: ${from} → ${deal.stage}`)}}
  else if(d.type==="po"){const p=PURCH.find(x=>x.id===d.id);if(target&&target.dataset.pcol!==p.status){const from=p.status;if(movePurch(p,target.dataset.pcol)){toast(`Solicitud #${p.num}: ${from} → ${p.status}`);renderApp()}return}}
  else if(d.type==="pr"){const o=PORDERS.find(x=>x.id===d.id);if(target&&target.dataset.prcol!==o.status){const from=o.status;if(moveOrder(o,target.dataset.prcol)){toast(`OP #${o.num}: ${from} → ${o.status}`);renderApp()}return}}
  else if(target)moveEvent(d.id,target.dataset.dropD,target.dataset.dropH);
  if(document.querySelector(".sheet"))renderView();else renderApp();
}
document.addEventListener("pointerup",endDrag);
document.addEventListener("pointercancel",endDrag);

async function setUserActive(id,on){const u=userById(id);if(isOwner(u)||u.id===S.user.id){renderView();return}

/* version 3 one-time setup, run once by the Superusuario: new warehouse names, the Matriz de productos, staff of PRINCIPAL and the first users */
function applySeedV3(){const D=SEED_V3,r={sites:0,prods:0,staff:0};
  Object.entries(D.rename).forEach(([o,n])=>{if(STORES.includes(o)&&!STORES.includes(n)){renameStore(o,n);r.sites++}});
  D.sites.forEach(([code,name])=>{let s=SITES.list.find(x=>x.name===name);if(!s){SITES.list.push(s={code,name});r.sites++}s.code=code});
  SITES.list.sort((a,b)=>a.code.localeCompare(b.code,"es",{numeric:true}));SITES.prod=D.prod;syncStores();
  D.prods.forEach(([code,name,unit,group,sub,brand])=>{if(!PRODS.some(p=>p.code===code)){PRODS.push({id:nid("mx"),code,name,unit,group,sub,brand});r.prods++}});
  D.staff.forEach(([name,cargo])=>{if(!NOMINA.some(p=>p.name.toLowerCase()===name.toLowerCase())){NOMINA.push({id:nid("p"),name,cargo,store:"PRINCIPAL"});r.staff++}});
  enforceOwner();return r}
async function seedUsersV3(){const ok=[],bad=[];
  for(const [name,email,role,mods,allStores] of SEED_V3.users){if(TEAM.some(u=>u.email?.toLowerCase()===email))continue;
    try{let aad=null;if(typeof READY!=="undefined"&&READY){const g=await graph(`/users/${encodeURIComponent(email)}?$select=id`);if(!g)throw new Error("no existe en el Microsoft 365 de FC");aad=g.id;await groupAccess({aad,email},true)}
      TEAM.push({id:nid("u"),aad,name,email,role,mods:[...mods],stores:allStores?[...STORES]:[],active:true,created:TODAY_ISO});ok.push(name)}
    catch(e){bad.push(`${name} (${email}): ${e.message}`)}}
