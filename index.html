const OBJECTS={HOURS,MALLAS,GOALS,EVAL,CRM:PARAMS.crm,PURCHP:PARAMS.purch,TASKP:PARAMS.tasks,SITES};
const COLS=[...Object.keys(ARRAYS),"config"];
const DEFAULTS=Object.fromEntries(["EVAL","CRM","PURCHP","TASKP"].map(k=>[k,JSON.parse(JSON.stringify(OBJECTS[k]))]));
const BASE={},ETAG={};

async function m365Token(){
  try{return(await MSAL.acquireTokenSilent({scopes:M365.scopes,account:ACCOUNT})).accessToken}
  catch(e){await MSAL.acquireTokenRedirect({scopes:M365.scopes,account:ACCOUNT});throw e}
}
async function graph(path,opt={}){
  const t=await m365Token();const json=typeof opt.body==="string";
  const r=await fetch(path.startsWith("http")?path:"https://graph.microsoft.com/v1.0"+path,{...opt,headers:{Authorization:"Bearer "+t,...(json?{"Content-Type":"application/json"}:{}),...(opt.headers||{})}});
  if(r.status===404&&!opt.strict)return null;
  if(!r.ok){const err=new Error(`Microsoft respondió ${r.status}: ${(await r.text()).slice(0,180)}`);err.status=r.status;throw err}
  return r.status===204?null:(r.headers.get("content-type")||"").includes("json")?r.json():r.text();
}

function makeClean(){
  [EVENTS,TASKS,DEALS,PURCH,NOTES,INCIDENTS,PERMISOS,NOMINA,PORDERS,PRODS].forEach(a=>a.splice(0));
  TEAM.splice(0,TEAM.length,

    {id:"u_ivan",name:IVAN.name,email:IVAN.email,role:"gerencia",mods:MODULES.map(m=>m.id),stores:[...STORES]});
  enforceOwner();Object.keys(MALLAS).forEach(k=>delete MALLAS[k]);Object.keys(GOALS).forEach(k=>delete GOALS[k]);
}
/* ---------- files in the shared library ---------- */
const fpath=n=>`/drives/${SPACE.driveId}/root:/${SPACE.folder}/${n}.json`;
async function readCol(n){const meta=await graph(fpath(n));if(!meta)return null;const r=await fetch(meta["@microsoft.graph.downloadUrl"],{cache:"no-store"});return{etag:meta.eTag,data:await r.json()}}
async function writeCol(n,data,etag){return graph(fpath(n)+":/content",{method:"PUT",body:JSON.stringify(data),headers:etag?{"If-Match":etag}:{},strict:true})}
const toMap=a=>new Map(a.map(x=>[x.id,JSON.stringify(x)]));
const cfgSnap=()=>Object.fromEntries(Object.keys(OBJECTS).map(k=>[k,JSON.stringify(OBJECTS[k])]));
function applyRemote(n,data){
  // settings keep their default values for anything added in a newer version of the app
  if(n==="config"){Object.entries(data||{}).forEach(([k,x])=>{const t=OBJECTS[k];if(t&&x){const def=DEFAULTS[k]||{};Object.keys(t).forEach(z=>delete t[z]);Object.assign(t,JSON.parse(JSON.stringify(def)),x);
      Object.keys(def).forEach(z=>{if(def[z]&&typeof def[z]==="object"&&!Array.isArray(def[z])&&t[z]&&typeof t[z]==="object")t[z]={...def[z],...t[z]}})}});syncStores();BASE.config=cfgSnap()}
  else{ARRAYS[n].splice(0,ARRAYS[n].length,...(data||[]));BASE[n]=toMap(ARRAYS[n])}
}
/* save one collection: send only what changed here, on top of the latest copy, so two people saving at once do not overwrite each other */
async function syncCol(n){
  for(let i=0;i<4;i++){
    let merged;const remote=await readCol(n);
    if(n==="config"){const base=BASE.config||{},changed=Object.keys(OBJECTS).filter(k=>JSON.stringify(OBJECTS[k])!==base[k]);if(!changed.length)return false;
      merged={...(remote?.data||{})};changed.forEach(k=>merged[k]=OBJECTS[k])}
    else{const base=BASE[n]||new Map(),cur=toMap(ARRAYS[n]),up=new Set([...cur.keys()].filter(k=>base.get(k)!==cur.get(k))),del=[...base.keys()].filter(k=>!cur.has(k));
      if(!up.size&&!del.length)return false;
      const rm=new Map((remote?.data||[]).map(x=>[x.id,x]));del.forEach(k=>rm.delete(k));
      merged=[];ARRAYS[n].forEach(x=>{if(up.has(x.id))merged.push(x);else if(rm.has(x.id))merged.push(rm.get(x.id))});
      rm.forEach((x,k)=>{if(!cur.has(k))merged.push(x)})}
    try{const r=await writeCol(n,merged,remote?.etag);ETAG[n]=r?.eTag;applyRemote(n,merged);return true}
    catch(e){if(e.status!==412)throw e}
  }
  throw new Error("Otra persona estaba guardando al mismo tiempo. Vuelve a intentar en unos segundos.");
}
function scheduleSave(){if(!READY||QUIET)return;clearTimeout(SAVE_T);SAVE_T=setTimeout(saveNow,1200)}
async function saveNow(){
  if(SYNCING){scheduleSave();return}SYNCING=true;let changed=false;
  try{for(const n of COLS)changed=(await syncCol(n))||changed;if(changed){LAST_SAVE=new Date();SYNC_ERR=null}}
  catch(e){SYNC_ERR=e.message}
  SYNCING=false;refreshSync();if(changed)softRender();
}
/* every 45 s bring in what other people saved, without interrupting a form or an audit in progress */
async function pullOthers(){
  if(!READY||SYNCING)return;
  try{const list=await graph(`/drives/${SPACE.driveId}/root:/${SPACE.folder}:/children?$select=name,eTag`);let changed=false;
    for(const f of list?.value||[]){const n=f.name.replace(/\.json$/,"");if(!COLS.includes(n)||ETAG[n]===f.eTag)continue;
      const r=await readCol(n);if(!r)continue;ETAG[n]=r.etag;
      // keep local edits that are not saved yet: they are merged by the next save
      const local=n==="config"?null:toMap(ARRAYS[n]),dirty=n==="config"?JSON.stringify(cfgSnap())!==JSON.stringify(BASE.config):[...local].some(([k,v])=>BASE[n]?.get(k)!==v)||[...(BASE[n]||[]).keys()].some(k=>!local.has(k));
      if(dirty){scheduleSave();continue}applyRemote(n,r.data);changed=true}
    if(changed){enforceOwner();const me=TEAM.find(u=>u.email?.toLowerCase()===ME.email);if(me)S.user=me;softRender()}
  }catch(e){SYNC_ERR=e.message;refreshSync()}
}
function softRender(){if(document.querySelector(".sheet")||S.view==="run"||document.getElementById("app").hidden)return;QUIET=true;try{renderApp()}finally{QUIET=false}}
function refreshSync(){const box=document.getElementById("sync-box");if(box)box.outerHTML=syncBox()}
function syncBox(){
  if(!ACCOUNT)return `<div id="sync-box" class="sync" style="padding:0 12px"><span>Sin conectar</span></div>`;
  return `<div id="sync-box" class="sync" style="padding:0 12px;display:grid;gap:6px">
    <span><span class="dot" style="background:#0A64C9"></span>Outlook conectado</span>
    <span><span class="dot" style="background:${SYNC_ERR?"var(--r)":"#1D7044"}"></span>${SYNC_ERR?"Error al guardar":LAST_SAVE?"Guardado "+LAST_SAVE.toTimeString().slice(0,5):"Datos compartidos"}</span>
    ${SYNC_ERR?`<span class="muted" style="font-size:11px">${esc(SYNC_ERR)}</span>`:""}</div>`;
}
/* ---------- Outlook: scheduled visits go to the calendar of whoever schedules them, with the responsible person invited ---------- */
async function outlookUpsert(e){
  if(!READY||e.outlook===false)return;
  try{const tpl=tplById(e.tpl),t0=e.time||"08:00",[h,m]=t0.split(":").map(Number),t1=`${String(Math.min(23,h+1)).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
    const what=isVisit(tpl)?(e.mtype||"Visita"):isCount(tpl)?"Conteo cíclico":"Auditoría",who=userById(e.assignee);
    const body={subject:`${what} · ${e.store}`,body:{contentType:"text",content:`JE - CONTROL · ${tpl.name} · Responsable: ${who.name}`},
      start:{dateTime:`${e.date}T${t0}:00`,timeZone:"SA Pacific Standard Time"},end:{dateTime:`${e.date}T${t1}:00`,timeZone:"SA Pacific Standard Time"},location:{displayName:e.store},categories:["JE - CONTROL"]};
    if(who.email&&who.email.toLowerCase()!==ME.email)body.attendees=[{emailAddress:{address:who.email,name:who.name},type:"required"}];
    if(e.outlookId)await graph(`/me/events/${e.outlookId}`,{method:"PATCH",body:JSON.stringify(body)});
    else{const r=await graph("/me/events",{method:"POST",body:JSON.stringify(body)});e.outlookId=r.id}
    scheduleSave();toast(`Agendado en Outlook: ${what} · ${e.store}`);
  }catch(err){toast("No se pudo agendar en Outlook: "+err.message)}
}
/* notices in Outlook: an event in the calendar of whoever acts, inviting the people who must confirm, authorize or produce */
async function outlookNotice(subject,who){
  if(!READY)return;const to=(who||[]).filter(u=>u?.email&&u.email.toLowerCase()!==ME.email);if(!to.length)return;
  try{const now=new Date();let d=new Date(now.getTime()+30*60000);d.setMinutes(d.getMinutes()<30?30:60,0,0);if(d.getHours()>=18||d.getHours()<7){d=new Date(now);d.setDate(d.getDate()+(now.getHours()>=7?1:0));d.setHours(8,0,0,0)}
    const t=x=>`${iso(x)}T${x.toTimeString().slice(0,5)}:00`,e=new Date(d.getTime()+30*60000);
    await graph("/me/events",{method:"POST",body:JSON.stringify({subject:"JE - CONTROL · "+subject,body:{contentType:"text",content:`${subject}\n\nÁbrelo en JE - CONTROL para gestionarlo: ${location.origin+location.pathname}`},
      start:{dateTime:t(d),timeZone:"SA Pacific Standard Time"},end:{dateTime:t(e),timeZone:"SA Pacific Standard Time"},showAs:"free",isReminderOn:true,reminderMinutesBeforeStart:0,categories:["JE - CONTROL"],
      attendees:to.map(u=>({emailAddress:{address:u.email,name:u.name},type:"required"}))})});
  }catch(err){console.warn("Aviso de Outlook no enviado",err)}
}
async function outlookDelete(e){if(!READY||!e.outlookId)return;try{await graph(`/me/events/${e.outlookId}`,{method:"DELETE"})}catch(err){console.warn("No se borró de Outlook",err)}}
{const _rv=renderView;renderView=function(){_rv();scheduleSave()}}
{const _sf=submitForm;submitForm=function(f){if(f.dataset.k==="user-create")return createUser(f);const n=EVENTS.length;const r=_sf(f);EVENTS.slice(n).filter(e=>e.kind==="programada").forEach(outlookUpsert);return r}}
{const _me=moveEvent;moveEvent=function(id,date,time){const e=EVENTS.find(x=>x.id===id);const before=e&&e.date+e.time;_me(id,date,time);if(e&&e.date+e.time!==before&&e.outlookId)outlookUpsert(e)}}

   <div class="lock" style="background:var(--surface-2);font-size:12px;display:grid;gap:2px"><span><strong>Administrador + Comercial</strong>: confirma las solicitudes de compra.</span><span><strong>Administrador + Compras</strong>: autoriza compras hasta ${cop(PARAMS.purch.authLimit)}. <strong>Usuario + Compras</strong>: auxiliar de compras.</span><span><strong>Administrador + Producción</strong>: completa, edita y elimina órdenes. <strong>Usuario + Producción</strong>: programa y registra lo producido.</span></div>
   <form id="user-f" data-k="user-create" style="display:grid;gap:10px">
    <div class="grid2"><div class="field"><label for="nu-email">Correo de FC</label><input id="nu-email" type="email" placeholder="nombre@distribuidorafc.com" required></div>
     <div class="field"><label for="nu-role">Rol</label><select id="nu-role"><option value="user">Usuario</option><option value="admin">Administrador (líder de área)</option>${isGer()?'<option value="gerencia">Gerencia</option>':""}</select></div></div>
    <div class="field"><label>Módulos</label><div class="row">${MODULES.filter(m=>m.id!=="ger"||isGer()).map(m=>`<label class="row" style="gap:5px;font-size:14px"><input type="checkbox" id="nu-m-${m.id}" value="${m.id}" name="nu-mod">${m.name}</label>`).join("")}</div></div>
    <div class="field"><label>Bodegas</label><div class="row">${STORES.map((s,i)=>`<label class="row" style="gap:5px;font-size:14px"><input type="checkbox" id="nu-s-${i}" value="${esc(s)}" name="nu-store">${esc(s)}</label>`).join("")}</div></div>

   <p class="example-note">Si alguien de FC entra sin tener usuario, te llega un correo con su solicitud y lo creas aquí.</p></div>`;

async function createUser(f){
  const email=document.getElementById("nu-email").value.trim().toLowerCase();
  const mods=[...f.querySelectorAll("input[name=nu-mod]:checked")].map(x=>x.value),stores=[...f.querySelectorAll("input[name=nu-store]:checked")].map(x=>x.value);
  if(!email)return toast("Escribe el correo");if(!mods.length)return toast("Elige al menos un módulo");
  if(TEAM.some(u=>u.email?.toLowerCase()===email))return toast("Ese correo ya tiene usuario");
  try{const u=await graph(`/users/${encodeURIComponent(email)}?$select=id,displayName,mail,jobTitle`);
    if(!u)return toast("Ese correo no existe en el Microsoft 365 de FC");
    await graph(`/groups/${SPACE.groupId}/members/$ref`,{method:"POST",body:JSON.stringify({"@odata.id":`https://graph.microsoft.com/v1.0/directoryObjects/${u.id}`})}).catch(e=>{if(!/already exist/i.test(e.message))throw e});
    const role=document.getElementById("nu-role").value;
    TEAM.push({id:nid("u"),aad:u.id,name:u.displayName,email,role,mods:role==="gerencia"?MODULES.map(m=>m.id):mods,stores,cargo:u.jobTitle||"",active:true,created:TODAY_ISO});
    renderView();toast(`${u.displayName} ya puede entrar a JE - CONTROL`);
  }catch(e){toast("No se pudo crear: "+e.message)}
}
/* membership of the shared space follows the user's state */
async function groupAccess(u,on){if(!READY)return;
  const aad=u.aad||(await graph(`/users/${encodeURIComponent(u.email)}?$select=id`))?.id;if(!aad)throw new Error("ese correo no existe en el Microsoft 365 de FC");u.aad=aad;
  if(on)await graph(`/groups/${SPACE.groupId}/members/$ref`,{method:"POST",body:JSON.stringify({"@odata.id":`https://graph.microsoft.com/v1.0/directoryObjects/${aad}`})}).catch(e=>{if(!/already exist/i.test(e.message))throw e});
  else await graph(`/groups/${SPACE.groupId}/members/${aad}/$ref`,{method:"DELETE"}).catch(e=>{if(e.status!==404)throw e})}
async function moveAccess(u,email){if(!READY)return;
  const g=await graph(`/users/${encodeURIComponent(email)}?$select=id`);if(!g)throw new Error("ese correo no existe en el Microsoft 365 de FC");
  if(u.active!==false){await groupAccess({aad:g.id,email},true);if(u.aad||u.email)await groupAccess(u,false).catch(()=>{})}u.aad=g.id}
async function removeUser(id){
  const u=userById(id);if(isOwner(u)||u.id===S.user.id)return;
  try{const aad=u.aad||(await graph(`/users/${encodeURIComponent(u.email)}?$select=id`))?.id;
    if(aad)await graph(`/groups/${SPACE.groupId}/members/${aad}/$ref`,{method:"DELETE"}).catch(()=>{});
    TEAM.splice(TEAM.indexOf(u),1);renderView();toast(`${u.name} ya no tiene acceso`);
  }catch(e){toast("No se pudo quitar: "+e.message)}
}
/* ---------- screens before the app: setup (first time, Superusuario only) and access requests ---------- */
function gate(html){document.getElementById("app").hidden=true;const L=document.getElementById("login");L.hidden=false;
  L.innerHTML=`<div class="login-card"><div class="login-logo"><img src="${LOGO_FULL}" alt="JE Consultoría"><div class="app-name">JE <b>-</b> CONTROL</div></div>${html}</div>`}
function setupScreen(){
  gate(`<div class="eyebrow">Instalación · solo una vez</div><h2 style="font-size:20px;margin:0">Crear el espacio compartido de datos</h2>
   <p class="muted" style="margin:0">Se crea un grupo privado de Microsoft 365 llamado <strong>${SPACE.name}</strong>, oculto de Outlook y de la libreta de direcciones, con su carpeta de datos. Tú e ${IVAN.name} quedan como propietarios. La app arranca en limpio, conservando las plantillas, las bodegas, los horarios y la parametrización.</p>
   <button class="btn primary" data-act="setup-run">Crear el espacio y empezar</button><div id="setup-log" class="muted" style="font-size:13px;display:grid;gap:4px"></div>`);
}
async function setupRun(){
  const log=t=>document.getElementById("setup-log").insertAdjacentHTML("beforeend",`<div>• ${esc(t)}</div>`);
  const btn=document.querySelector("[data-act=setup-run]");btn.disabled=true;
  try{
    log("Buscando a "+IVAN.name+"…");const ivan=await graph(`/users/${encodeURIComponent(IVAN.email)}?$select=id,displayName`);
    if(!ivan)log("Aviso: no encontré "+IVAN.email+"; podrás agregarlo luego en Usuarios.");
    const people=[ME.id,...(ivan?[ivan.id]:[])].map(id=>`https://graph.microsoft.com/v1.0/users/${id}`);
    log("Creando el grupo privado…");
    const g=await graph("/groups",{method:"POST",body:JSON.stringify({displayName:SPACE.name,mailNickname:SPACE.nick,description:"Datos de JE - CONTROL. No modificar a mano.",groupTypes:["Unified"],mailEnabled:true,securityEnabled:false,visibility:"Private","owners@odata.bind":people,"members@odata.bind":people})});
    SPACE.groupId=g.id;
    log("Ocultándolo de Outlook y de la libreta de direcciones…");
    for(const p of [{hideFromOutlookClients:true},{hideFromAddressLists:true}])await graph(`/groups/${g.id}`,{method:"PATCH",body:JSON.stringify(p)}).catch(e=>log("Aviso: "+e.message));
    log("Esperando a que Microsoft prepare la biblioteca de archivos (puede tardar 1 o 2 minutos)…");
    for(let i=0;i<40&&!SPACE.driveId;i++){const d=await graph(`/groups/${g.id}/drive?$select=id`).catch(()=>null);if(d?.id)SPACE.driveId=d.id;else await new Promise(r=>setTimeout(r,6000))}
    if(!SPACE.driveId)throw new Error("La biblioteca todavía no está lista. Espera unos minutos y vuelve a entrar.");
    log("Creando la carpeta de datos…");
    await graph(`/drives/${SPACE.driveId}/root/children`,{method:"POST",body:JSON.stringify({name:SPACE.folder,folder:{},"@microsoft.graph.conflictBehavior":"replace"})});
    log("Guardando la app en limpio…");makeClean();
    for(const n of COLS){await writeCol(n,n==="config"?Object.fromEntries(Object.entries(OBJECTS)):ARRAYS[n]);}
    log("Listo.");await startApp();
  }catch(e){log("Error: "+e.message);btn.disabled=false}
}
function noAccessScreen(){
  gate(`<div class="eyebrow">Hola, ${esc(ME.name.split(" ")[0])}</div><h2 style="font-size:20px;margin:0">Todavía no tienes acceso</h2>
   <p class="muted" style="margin:0">Tu cuenta (${esc(ME.email)}) no tiene usuario en JE - CONTROL. Pide acceso y Gerencia te creará con los módulos y bodegas que te correspondan.</p>
   <button class="btn primary" data-act="req-access">Pedir acceso</button><button class="btn" data-act="m365-out">Cerrar sesión</button>`);
}
async function requestAccess(btn){
  btn.disabled=true;
  try{const to=[OWNER_EMAIL,IVAN.email].map(a=>({emailAddress:{address:a}}));
    await graph("/me/sendMail",{method:"POST",body:JSON.stringify({message:{subject:`JE - CONTROL: ${ME.name} pide acceso`,
      body:{contentType:"Text",content:`${ME.name} (${ME.email}) pide acceso a JE - CONTROL.\n\nPara darle acceso, entra a la app → Usuarios → Crear usuario, escribe su correo y elige su rol, módulos y bodegas.\n\n${location.origin+location.pathname}`},toRecipients:to}})});
    btn.outerHTML='<div class="lock" style="background:var(--g-bg)">Listo: Gerencia recibió tu solicitud por correo. Cuando te creen el usuario, vuelve a entrar.</div>';
  }catch(e){btn.disabled=false;toast("No se pudo enviar: "+e.message)}
}
/* ---------- start ---------- */
async function findSpace(){
  const g=await graph(`/groups?$filter=${encodeURIComponent(`displayName eq '${SPACE.name}'`)}&$select=id`);SPACE.groupId=g?.value?.[0]?.id||null;
  if(!SPACE.groupId)return"missing";
  const d=await graph(`/groups/${SPACE.groupId}/drive?$select=id`).catch(e=>e.status===403?null:Promise.reject(e));
  if(!d?.id)return"denied";SPACE.driveId=d.id;return"ok";
}
async function startApp(){
  for(const n of COLS){const r=await readCol(n);if(r){ETAG[n]=r.etag;applyRemote(n,r.data)}}
  enforceOwner();const me=TEAM.find(u=>u.email?.toLowerCase()===ME.email);
  if(!me)return noAccessScreen();
  if(me.active===false)return gate(`<div class="eyebrow">Hola, ${esc(ME.name.split(" ")[0])}</div><h2 style="font-size:20px;margin:0">Tu usuario está inactivo</h2><p class="muted" style="margin:0">Pide a Gerencia que lo active de nuevo.</p><button class="btn" data-act="m365-out">Cerrar sesión</button>`);
  if(isOwner(me))me.name=ME.name;
  S.user=me;S.mod=me.mods[0]||"log";READY=true;me.lastLogin=new Date().toISOString();
  if(isOwner(me)&&!SITES.seeded){gate('<p class="muted" style="text-align:center">Preparando la versión 3: bodegas, productos, personal y usuarios…</p>');await runSeedV3();await saveNow()}
  document.getElementById("app").hidden=true;document.getElementById("login").hidden=false;renderLogin(2);
  setInterval(pullOthers,45000);
}
async function m365Start(){
  MSAL=new msal.PublicClientApplication({auth:{clientId:M365.clientId,authority:`https://login.microsoftonline.com/${M365.tenantId}`,redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});
  await MSAL.initialize();
  const res=await MSAL.handleRedirectPromise().catch(e=>{toast("Error al iniciar sesión: "+e.message);return null});
  ACCOUNT=res?.account||MSAL.getAllAccounts()[0]||null;
  if(!ACCOUNT)return;
  gate('<p class="muted" style="text-align:center">Conectando con Microsoft 365…</p>');
  try{
    const me=await graph("/me?$select=id,displayName,mail,userPrincipalName");ME={id:me.id,name:me.displayName,email:(me.mail||me.userPrincipalName).toLowerCase()};
    const st=await findSpace();
    if(st==="missing")return ME.email===OWNER_EMAIL?setupScreen():gate('<p class="muted">JE - CONTROL todavía no está instalado. Pide a Gerencia que lo active.</p>');
    if(st==="denied")return noAccessScreen();
    await startApp();
  }catch(e){gate(`<div class="lock" style="background:var(--r-bg)">No se pudo conectar con Microsoft 365: ${esc(e.message)}</div><button class="btn" data-act="m365-out">Cerrar sesión y volver a intentar</button>`)}
}
document.addEventListener("click",ev=>{const el=ev.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;
  const own={"ms-login":()=>MSAL.loginRedirect({scopes:M365.scopes,prompt:"select_account"}),"m365-out":()=>MSAL.logoutRedirect({account:ACCOUNT}),
    "setup-run":setupRun,"req-access":()=>requestAccess(el),"user-remove":()=>removeUser(el.dataset.id)}[a];
  if(own&&MSAL){ev.stopImmediatePropagation();own()}
},true);

renderLogin(1);
m365Start();
</script>
